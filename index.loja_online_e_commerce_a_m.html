    <!-- Blindagem Avançada A&M Anti-DevTools, Anti-Inspeção e Anti-Cópia -->
    <script>
        (function() {
            'use strict';

            // 1. Proteção Anti-Iframe (Clickjacking)
            if (window.top !== window.self) {
                try { window.top.location = window.self.location; } catch (e) {}
            }

            window.addEventListener('DOMContentLoaded', () => {
                // 2. Bloqueia Botão Direito (Menu de Contexto) em fase de captura
                window.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }, true);

                // 3. Bloqueia Arrastar Imagens/Elementos e Cópia de Código
                window.addEventListener('dragstart', function(e) {
                    e.preventDefault();
                    return false;
                }, true);

                window.addEventListener('copy', function(e) {
                    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
                    if (tag !== 'input' && tag !== 'textarea') {
                        e.preventDefault();
                        return false;
                    }
                }, true);

                // 4. Bloqueia todos os atalhos de DevTools, Código-Fonte, Salvar e Imprimir (Windows, Linux e Mac)
                window.addEventListener('keydown', function(e) {
                    const key = (e.key || '').toUpperCase();
                    const code = e.keyCode || e.which;

                    // F12 ou tecla Menu de Contexto (Shift+F10 / ContextMenu)
                    if (key === 'F12' || code === 123 || key === 'CONTEXTMENU' || (e.shiftKey && key === 'F10')) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }

                    // Ctrl + Shift + (I, J, C, K, E, M, U) — Chrome, Edge, Firefox, Brave, Opera
                    if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K', 'E', 'M', 'U'].includes(key)) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }

                    // Ctrl + (U = Ver Fonte, S = Salvar Página, P = Imprimir Tela, G = Busca Fonte)
                    if (e.ctrlKey && ['U', 'S', 'P'].includes(key)) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }

                    // Mac: Cmd + Option + (I, J, C, K, U, E) ou Cmd + (U, S, P)
                    if ((e.metaKey && e.altKey && ['I', 'J', 'C', 'K', 'U', 'E'].includes(key)) ||
                        (e.metaKey && ['U', 'S', 'P'].includes(key)) ||
                        (e.metaKey && e.shiftKey && ['I', 'J', 'C'].includes(key))) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                }, true);

                // 5. Oculta o documento caso tentem imprimir/salvar a página principal via menu do navegador
                window.addEventListener('beforeprint', () => {
                    document.body.style.visibility = 'hidden';
                    document.body.style.display = 'none';
                });
                window.addEventListener('afterprint', () => {
                    document.body.style.visibility = 'visible';
                    document.body.style.display = '';
                });

                // 6. Detector Ativo de DevTools Aberto (Mesmo se aberto pelo menu de 3 pontos do navegador)
                let devtoolsLocked = false;
                const showSecurityOverlay = (active) => {
                    let overlay = document.getElementById('am-security-shield');
                    if (active && !overlay) {
                        overlay = document.createElement('div');
                        overlay.id = 'am-security-shield';
                        overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#030712;color:#F8FAFC;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:Inter,sans-serif;';
                        overlay.innerHTML = '<div style="max-width:420px;background:#0A1222;border:1px solid #EF4444;border-radius:16px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,0.9);"><div style="font-size:44px;margin-bottom:12px;">⛔</div><h2 style="font-size:20px;font-weight:800;color:#EF4444;margin:0 0 8px;">ACESSO RESTRITO DETECTADO</h2><p style="font-size:13px;color:#94A3B8;line-height:1.6;margin:0;">As ferramentas de inspeção e desenvolvimento estão bloqueadas por segurança neste sistema. Feche o painel de desenvolvedor para voltar a operar.</p></div>';
                        document.body.appendChild(overlay);
                    } else if (!active && overlay) {
                        overlay.remove();
                    }
                };

                const checkDevTools = () => {
                    // Verifica diferença anormal entre janela externa e interna (DevTools acoplado)
                    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    const widthDiff = window.outerWidth - window.innerWidth > 170;
                    const heightDiff = window.outerHeight - window.innerHeight > 170;
                    let timingTrap = false;

                    const start = performance.now();
                    try {
                        // Armadilha de depuração caso o DevTools esteja aberto
                        (function() {}).constructor('debugger')();
                    } catch (err) {}
                    if (performance.now() - start > 120) {
                        timingTrap = true;
                    }

                    const detected = (!isMobile && (widthDiff || heightDiff)) || timingTrap;
                    if (detected !== devtoolsLocked) {
                        devtoolsLocked = detected;
                        showSecurityOverlay(detected);
                    }
                };

                // 7. Limpeza e neutralização contínua do Console contra injeção de scripts
                const warnStyle = "color: #EF4444; font-size: 26px; font-weight: 800; text-shadow: 1px 1px 0 #000;";
                const subStyle = "color: #F5A524; font-size: 14px; font-weight: 600;";
                const rawClear = console.clear ? console.clear.bind(console) : () => {};
                const rawLog = console.log ? console.log.bind(console) : () => {};

                const noop = function() {};
                ['debug', 'info', 'dir', 'dirxml', 'table', 'trace'].forEach(method => {
                    try { console[method] = noop; } catch (e) {}
                });

                setInterval(() => {
                    try {
                        rawClear();
                        rawLog("%c⛔ ACESSO RESTRITO - SISTEMA PROTEGIDO A&M", warnStyle);
                        rawLog("%cQualquer tentativa de inspeção ou injeção de código neste terminal é bloqueada.", subStyle);
                        checkDevTools();
                    } catch (e) {}
                }, 1000);

                window.addEventListener('resize', checkDevTools);
            });
        })();
    </script>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;
        const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, PieChart, Pie, Cell } = window.Recharts;

        // Constantes Globais (Chaves secretas removidas do código-fonte público para proteção contra inspeção)
        const MASTER_EMAIL = 'and03jhe@gmail.com';
        const DEFAULT_R2_CONFIG = {
            bucket: "renata",
            accountId: "",
            accessKeyId: "",
            secretAccessKey: "",
            publicUrl: "https://pub-d2e1857146514b24991a326f11a87bd8.r2.dev"
        };

        const ALL_NAV_TABS = [
            { id: 'dashboard', label: 'Dashboard', icon: 'ph-house' },
            { id: 'caixa', label: 'Ponto de Venda', icon: 'ph-shopping-cart' },
            { id: 'turnos', label: 'Caixas e Turnos', icon: 'ph-wallet' },

        const formatMoney = (val) => `R$ ${parseFloat(val || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        const generateId = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).substr(2);

        // Limites de Armazenamento (Bloqueio rígido em 9,5 GB para proteger a cota gratuita de 10 GB)
        const R2_TOTAL_QUOTA_BYTES = 10 * 1024 * 1024 * 1024; // 10 GB
        const R2_BLOCK_LIMIT_BYTES = 9.5 * 1024 * 1024 * 1024; // 9,5 GB (Bloqueio de segurança)
        const R2_DANGER_LIMIT_BYTES = 9 * 1024 * 1024 * 1024; // 9 GB (Alerta vermelho)

        // Sintetizador de Áudio do Caixa (Bip de Produto, Venda Efetuada e Alerta) com Controle de Volume
        const PosSoundEngine = {
            ctx: null,
            getContext() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                return this.ctx;
            },
            play(type, enabled = true, volumePercent = 80) {
                if (!enabled || volumePercent <= 0) return;
                try {
                    const ctx = this.getContext();
                    if (!ctx) return;
                    const vol = Math.min(1, Math.max(0, volumePercent / 100));
                    const now = ctx.currentTime;

                    if (type === 'beep') {
                        // Som de caixa ao passar/adicionar produto (Bip de Scanner de PDV)
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(1820, now);
                        gain.gain.setValueAtTime(vol * 0.45, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.085);
                    } else if (type === 'success') {
                        // Som de Venda Efetuada / Caixa Registradora
                        const notes = [1046.50, 1318.51, 1567.98, 2093.00];
                        notes.forEach((freq, idx) => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = idx === notes.length - 1 ? 'triangle' : 'sine';
                            const startTime = now + (idx * 0.065);
                            const duration = idx === notes.length - 1 ? 0.45 : 0.16;
                            osc.frequency.setValueAtTime(freq, startTime);
                            gain.gain.setValueAtTime(vol * 0.45, startTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(startTime);
                            osc.stop(startTime + duration);
                        });
                    } else if (type === 'error') {
                        // Som de erro / estoque esgotado
                        [0, 0.13].forEach(offset => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(210, now + offset);
                            gain.gain.setValueAtTime(vol * 0.25, now + offset);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.1);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start(now + offset);
                            osc.stop(now + offset + 0.1);
                        });
                    }
                } catch (e) {
                    console.error("Erro ao reproduzir som do caixa:", e);
                }
            }
        };

        // Função para criar instância S3 conectada ao Cloud R2
        const createR2Client = (cfg = {}) => {
            const merged = { ...DEFAULT_R2_CONFIG, ...cfg };
            return new AWS.S3({
                endpoint: `https://${merged.accountId.trim()}.r2.cloudflarestorage.com`,
                accessKeyId: merged.accessKeyId.trim(),
                secretAccessKey: merged.secretAccessKey.trim(),
                signatureVersion: 'v4',
                region: 'auto'
            });
        };

        // Função Global para Registrar Histórico de Atividades no Firestore
        const recordHistory = async (userProfile, actionLabel, details = "") => {
            if (!window.firebaseDb || !userProfile) return;
            try {
                await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'history'), {
                    at: new Date().toISOString(),
                    userName: userProfile.name || userProfile.email,
                    userEmail: userProfile.email,
                    userRole: userProfile.isProgrammer ? 'programador' : (userProfile.role || 'colab'),
                    action: actionLabel,
                    details: details
                });
            } catch (e) {
                console.error("Erro ao gravar histórico:", e);
            }
        };

        // Função Utilitária para Limpar uma Coleção Inteira do Firestore
        const wipeCollectionDocs = async (colName) => {
            const snap = await window.fb.getDocs(window.fb.collection(window.firebaseDb, colName));
            const promises = snap.docs.map(d => window.fb.deleteDoc(window.fb.doc(window.firebaseDb, colName, d.id)));
            await Promise.all(promises);
            return snap.docs.length;
        };

        // Contexto de Toasts
        const ToastContext = createContext(null);
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const addToast = useCallback((message, type = 'info') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            }, []);

            const toast = useMemo(() => ({
                success: (msg) => addToast(msg, 'success'),
                error: (msg) => addToast(msg, 'error'),
                info: (msg) => addToast(msg, 'info')
            }), [addToast]);

            return (
                <ToastContext.Provider value={toast}>
                    {children}
                    <div className="toast-container">
                        {toasts.map(t => (
                            <div key={t.id} className={`toast ${t.type}`}>

        // Componente SVG de Código de Barras (Para Etiquetas)
        const BarcodeSVG = ({ value, width = 1.6, height = 38, displayValue = true }) => {

            useEffect(() => {
                if (svgRef.current && window.JsBarcode) {
                    try {
                        window.JsBarcode(svgRef.current, String(value || '00000000'), {
                            format: "CODE128",
                            width: width,
                            height: height,
                            displayValue: displayValue,
                            fontSize: 11,
                            margin: 2,
                            background: "transparent",
                            lineColor: "#000000"
                        });
                    } catch (e) {
                        console.error("Erro JsBarcode:", e);
                    }
                }
            }, [value, width, height, displayValue]);
            return <svg ref={svgRef} className="max-w-full h-auto mx-auto"></svg>;
        };

        // Hook de Dados em Tempo Real do Firestore
        const useAppStore = (user) => {
            const [data, setData] = useState({
                profile: null, products: [], sales: [], sessions: [], cashMovements: [], users: [], settings: {}, history: [], expenses: [], orders: []
            });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!user) {
                    setData({profile: null, products: [], sales: [], sessions: [], cashMovements: [], users: [], settings: {}, history: [], expenses: [], orders: []});
                    return;
                }

                let unsubscribes = [];
                setLoading(true);
                const isMaster = user.email?.toLowerCase() === MASTER_EMAIL;

                try {
                    const unsubProfile = window.fb.onSnapshot(window.fb.doc(window.firebaseDb, 'users', user.uid), async (snap) => {
                        if (snap.exists()) {
                            const docData = snap.data();
                            if (isMaster && docData.role !== 'programador') {
                                await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.uid), {
                                    ...docData,
                                    role: 'programador',
                                    name: docData.name === 'Administrador Principal' ? 'Programador Geral' : (docData.name || 'Programador Geral'),
                                    isProgrammer: true
                                }, { merge: true });
                            }
                            setData(prev => ({
                                ...prev,
                                profile: {
                                    id: snap.id,
                                    ...docData,
                                    role: isMaster ? 'programador' : docData.role,
                                    isProgrammer: isMaster || docData.role === 'programador'
                                }
                            }));
                        } else if (isMaster) {
                            const masterProfile = {
                                role: 'programador',
                                isProgrammer: true,
                                email: user.email,
                                name: 'Programador Geral',
                                active: true,
                                permissions: ALL_NAV_TABS.map(t => t.id)
                            };
                            await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', user.uid), masterProfile);
                            setData(prev => ({ ...prev, profile: { id: user.uid, ...masterProfile } }));
                        }
                    });
                    unsubscribes.push(unsubProfile);

                    const collectionsToWatch = ['products', 'sales', 'sessions', 'cashMovements', 'users', 'history', 'expenses', 'orders'];
                    collectionsToWatch.forEach(colName => {
                        const unsub = window.fb.onSnapshot(window.fb.collection(window.firebaseDb, colName), (snapshot) => {
                            const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                            setData(prev => ({ ...prev, [colName]: docs }));
                        });
                        unsubscribes.push(unsub);
                    });

                    const unsubSettings = window.fb.onSnapshot(window.fb.doc(window.firebaseDb, 'settings', 'geral'), (snap) => {
                        if (snap.exists()) setData(prev => ({ ...prev, settings: snap.data() }));
                        else setData(prev => ({ ...prev, settings: {} }));
                    });
                    unsubscribes.push(unsubSettings);

                } catch (err) {
                    console.error("Erro ao conectar Firestore:", err);
                }

                setLoading(false);
                return () => unsubscribes.forEach(unsub => unsub());

        // =====================================================================

            const [soundEnabled, setSoundEnabled] = useState(() => {
                try {
                    const saved = localStorage.getItem('am_pos_sound_enabled');
                    return saved !== null ? JSON.parse(saved) : true;
                } catch { return true; }
            });
            const [soundVolume, setSoundVolume] = useState(() => {
                try {
                    const saved = localStorage.getItem('am_pos_sound_volume');
                    return saved !== null ? Number(saved) : 80;
                } catch { return 80; }
            });

            useEffect(() => {
                try {
                    localStorage.setItem('am_pos_sound_enabled', JSON.stringify(soundEnabled));
                    localStorage.setItem('am_pos_sound_volume', String(soundVolume));
                } catch {}
            }, [soundEnabled, soundVolume]);

            const playPosSound = useCallback((type) => {
                PosSoundEngine.play(type, soundEnabled, soundVolume);
            }, [soundEnabled, soundVolume]);

            const [movementModal, setMovementModal] = useState({ open: false, type: 'withdrawal', amount: '', reason: '' });

            useEffect(() => {
                try {
                    localStorage.setItem('am_pos_cart_' + currentUser.email, JSON.stringify(cart));
                } catch {}
            }, [cart, currentUser.email]);

            const filteredCatalog = useMemo(() => {
                const term = searchTerm.trim().toLowerCase();
                if (!term) return products.filter(p => !p.blocked);
                return products.filter(p => !p.blocked && ((p.barcode && p.barcode.toLowerCase().includes(term)) || p.name.toLowerCase().includes(term)));
            }, [products, searchTerm]);

            const handleSearchKeyDown = (e) => {
                if (e.key === 'Enter' && searchTerm.trim()) {
                    e.preventDefault();
                    const term = searchTerm.trim().toLowerCase();
                    const exactBarcode = products.find(p => p.barcode && p.barcode.toLowerCase() === term);
                    const match = exactBarcode || filteredCatalog[0];
                    if (match) {
                        if (match.blocked) {
                            playPosSound('error');
                            toast.error("Este produto está bloqueado.");
                            return;
                        }
                        setSelectedProduct(match);
                        if (exactBarcode) {
                            addProductToCart(exactBarcode);
                        } else {
                            playPosSound('beep');
                        }
                        setSearchTerm('');
                    } else {
                        playPosSound('error');
                        toast.error("Produto ou código de barras não encontrado.");
                    }
                }
            };

            const addProductToCart = (prod) => {
                const target = prod || selectedProduct;
                if (!target) return;
                if (target.stock <= 0) {
                    playPosSound('error');
                    toast.error("Produto sem estoque disponível!");
                    return;
                }
                setCart(prev => {
                    const existing = prev.find(item => item.id === target.id);
                    if (existing && existing.qty >= target.stock) {
                        playPosSound('error');
                        toast.error("Quantidade máxima em estoque atingida.");
                        return prev;
                    }
                    playPosSound('beep');
                    toast.success(`${target.name} adicionado à lista!`);
                    if (existing) return prev.map(item => item.id === target.id ? {...item, qty: item.qty + 1} : item);
                    return [...prev, {...target, qty: 1}];
                });
            };

            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const discountVal = Math.min(subtotal, Math.max(0, parseFloat(discount || 0)));
            const baseAmount = Math.max(0, subtotal - discountVal);
            const cardSurcharge = (payment === 'Crédito' || payment === 'Débito') ? baseAmount * 0.06 : 0;
            const total = baseAmount + cardSurcharge;

            const handleOpenSession = async (e) => {
                e.preventDefault();
                if (fundoInicial === '' || isNaN(fundoInicial) || Number(fundoInicial) < 0) {
                    playPosSound('error');
                    toast.error("Informe um valor de fundo inicial válido.");
                    return;
                }
                try {
                    await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'sessions'), {
                        operator: currentUser.email,
                        operatorName: currentUser.name || currentUser.email.split('@')[0],
                        openedAt: new Date().toISOString(),
                        opening: parseFloat(fundoInicial),
                        status: 'open'
                    });
                    playPosSound('success');
                    await recordHistory(currentUser, "Abriu o Caixa", `Fundo inicial: ${formatMoney(fundoInicial)}`);
                    toast.success("Caixa aberto! Bom trabalho.");
                    setFundoInicial('');
                } catch(e) {
                    toast.error("Erro ao abrir caixa: " + e.message);
                }
            };

            const submitCashMovement = async (e) => {
                e.preventDefault();
                const val = parseFloat(movementModal.amount);
                if (!val || val <= 0) {
                    playPosSound('error');
                    toast.error("Informe um valor válido.");
                    return;
                }
                const label = movementModal.type === 'withdrawal' ? 'Sangria' : 'Reforço';
                try {
                    await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'cashMovements'), {
                        sessionId: activeSession.id,
                        type: movementModal.type,
                        amount: val,
                        reason: movementModal.reason || label,
                        at: new Date().toISOString(),
                        operator: currentUser.email,
                        operatorName: currentUser.name || currentUser.email
                    });
                    playPosSound('beep');
                    await recordHistory(currentUser, `Registrou ${label}`, `Valor: ${formatMoney(val)} - Motivo: ${movementModal.reason || 'Não informado'}`);
                    toast.success(`${label} registrada com sucesso!`);
                    setMovementModal({ open: false, type: 'withdrawal', amount: '', reason: '' });
                } catch(err) {
                    toast.error("Erro ao registrar movimentação: " + err.message);
                }
            };

            const finalizeSale = async () => {
                if (cart.length === 0) return;
                if (payment === 'Dinheiro' && (received === '' || parseFloat(received) < total)) {
                    playPosSound('error');
                    toast.error("O valor recebido em dinheiro é menor que o total da venda.");
                    return;
                }
                setIsProcessing(true);
                try {
                    await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'sales'), {
                        sessionId: activeSession.id,
                        operator: currentUser.email,
                        operatorName: currentUser.name || currentUser.email.split('@')[0],
                        items: cart,
                        subtotal,
                        discount: discountVal,
                        cardSurcharge,
                        total,
                        payment,
                        received: payment === 'Dinheiro' ? parseFloat(received) : total,
                        date: new Date().toISOString()
                    });

                    for (const item of cart) {
                        const prodRef = window.fb.doc(window.firebaseDb, 'products', item.id);
                        const latestProd = products.find(p => p.id === item.id);
                        const currentStock = latestProd ? latestProd.stock : item.stock;
                        await window.fb.updateDoc(prodRef, { stock: Math.max(0, currentStock - item.qty) });
                    }

                    // Toca o som de Venda Efetuada
                    playPosSound('success');
                    await recordHistory(currentUser, "Finalizou Venda no PDV", `Total: ${formatMoney(total)} (${payment}) - ${cart.reduce((a,b)=>a+b.qty,0)} itens`);
                    toast.success("Venda concluída e estoque atualizado!");
                    setCart([]);
                    setSelectedProduct(null);
                    setDiscount('');
                    setReceived('');
                } catch (e) {
                    playPosSound('error');
                    toast.error("Erro ao finalizar venda: " + e.message);
                }
                setIsProcessing(false);
            };

            // Barra de Controle de Som e Volume do Caixa
            const SoundControlWidget = () => (
                <div className="flex items-center gap-2.5 bg-[#0A1222] border border-[#1A233A] px-3 py-2 rounded-lg">
                    <button 
                        type="button"
                        onClick={() => {
                            const nextState = !soundEnabled;
                            setSoundEnabled(nextState);
                            if (nextState) PosSoundEngine.play('beep', true, soundVolume || 80);
                        }}
                        className={`flex items-center gap-1.5 text-xs font-bold transition-colors ${soundEnabled && soundVolume > 0 ? 'text-gold-accent' : 'text-text-muted hover:text-white'}`}
                        title={soundEnabled ? "Desativar som do caixa" : "Liberar som do caixa"}
                    >
                        <i className={`ph-fill ${!soundEnabled || soundVolume === 0 ? 'ph-speaker-slash text-red-400' : soundVolume < 50 ? 'ph-speaker-low' : 'ph-speaker-high'} text-lg`}></i>
                        <span className="hidden sm:inline">{soundEnabled && soundVolume > 0 ? 'Som Ativo' : 'Sem Som'}</span>
                    </button>
                    <input 
                        type="range" 
                        min="0" 
                        max="100" 
                        value={soundEnabled ? soundVolume : 0} 
                        onChange={e => {
                            const val = Number(e.target.value);
                            setSoundVolume(val);
                            if (val > 0 && !soundEnabled) setSoundEnabled(true);
                        }}
                        onMouseUp={() => PosSoundEngine.play('beep', soundEnabled, soundVolume)}
                        onTouchEnd={() => PosSoundEngine.play('beep', soundEnabled, soundVolume)}
                        className="w-20 sm:w-24 accent-gold-accent cursor-pointer h-1.5 bg-[#050B14] rounded-lg"
                        title={`Volume do Caixa: ${soundEnabled ? soundVolume : 0}%`}
                    />
                    <span className="text-[11px] font-mono text-text-muted w-8 text-right">
                        {soundEnabled ? `${soundVolume}%` : 'OFF'}
                    </span>
                </div>
            );

            if (!activeSession) {
                return (
                    <div className="fade-in pb-10 flex flex-col min-h-[75vh]">
                        <PageHeader 
                            title="Ponto de Venda" 
                            subtitle="Abra seu turno para iniciar as vendas." 
                            action={<SoundControlWidget />}
                        />
                        <div className="flex-1 flex items-center justify-center">
                            <form onSubmit={handleOpenSession} className="glass-panel p-8 sm:p-10 w-full max-w-md text-center shadow-2xl relative overflow-hidden">
                                <div className="w-20 h-20 bg-panel-border/50 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i className="ph ph-wallet text-4xl text-gold-accent"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-white mb-2">Seu Caixa está Fechado</h2>
                                <p className="text-sm text-text-muted mb-6">
                                    Operador: <strong className="text-white">{currentUser.name || currentUser.email}</strong>.<br/>
                                    Informe o fundo de troco inicial para abrir o turno. Note que o caixa permanecerá aberto até você encerrá-lo.
                                </p>
                                <div className="flex flex-col gap-4 bg-[#050B14] p-5 rounded-xl border border-panel-border text-left">
                                    <InputField label="Fundo Inicial em Dinheiro (R$)" type="number" step="0.01" min="0" value={fundoInicial} onChange={e => setFundoInicial(e.target.value)} placeholder="0.00" required />
                                    <ButtonPrimary type="submit" size="lg" className="w-full mt-2" icon="ph-lock-key-open">Abrir Caixa Agora</ButtonPrimary>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="fade-in flex flex-col h-auto min-h-full pb-10">
                    <PageHeader 
                        title="Ponto de Venda - Nova Venda" 
                        subtitle={`Turno aberto por ${activeSession.operatorName} às ${new Date(activeSession.openedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`}
                        action={
                            <>
                                <SoundControlWidget />
                                <ButtonOutline icon="ph-minus" className="border-red-500/30 text-red-400 hover:bg-red-500/10" onClick={() => setMovementModal({ open: true, type: 'withdrawal', amount: '', reason: '' })}>Sangria</ButtonOutline>
                                <ButtonOutline icon="ph-plus" className="border-green-500/30 text-green-400 hover:bg-green-500/10" onClick={() => setMovementModal({ open: true, type: 'supply', amount: '', reason: '' })}>Reforço</ButtonOutline>
                            </>
                        }
                    />

                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
                        <div className="xl:col-span-5 flex flex-col gap-5">
                            <div className="glass-panel p-2">
                                <div className="relative">
                                    <i className="ph ph-barcode absolute left-4 top-1/2 -translate-y-1/2 text-primary-blue text-xl"></i>
                                    <input 
                                        type="text" 
                                        value={searchTerm} 
                                        onChange={e => setSearchTerm(e.target.value)} 
                                        onKeyDown={handleSearchKeyDown} 
                                        placeholder="Leia com o scanner ou busque o produto..." 
                                        className="w-full bg-transparent py-3.5 pl-12 pr-20 text-sm sm:text-base text-white focus:outline-none placeholder:text-text-muted/70" 
                                    />
                                    <span className="absolute right-3 top-1/2 -translate-y-1/2 px-2 py-1 bg-[#1A233A] rounded text-[10px] text-text-muted font-mono uppercase">Enter</span>
                                </div>
                            </div>

                            <div className="glass-panel p-6 flex flex-col">
                                <h3 className="text-xs font-bold text-text-muted uppercase tracking-wider mb-4">Painel de Detalhes do Produto Selecionado</h3>
                                {selectedProduct ? (
                                    <div className="flex flex-col fade-in">
                                        <div className="flex flex-col sm:flex-row gap-5 mb-6">
                                            <div className="w-full sm:w-40 aspect-square rounded-xl bg-[#050B14] border border-[#1A233A] flex items-center justify-center overflow-hidden shrink-0">
                                                {selectedProduct.imageUrl ? (
                                                    <img src={selectedProduct.imageUrl} alt={selectedProduct.name} className="object-contain w-full h-full p-2"/>
                                                ) : (
                                                    <i className="ph ph-package text-5xl text-[#1A233A]"></i>
                                                )}
                                            </div>
                                            <div className="flex flex-col justify-center flex-1 min-w-0">
                                                <h4 className="text-xl font-bold text-white mb-3 truncate" title={selectedProduct.name}>{selectedProduct.name}</h4>
                                                <div className="bg-[#050B14] border border-[#1A233A] rounded-lg p-3 mb-3">
                                                    <p className="text-[10px] text-text-muted uppercase font-semibold">Valor Unitário:</p>
                                                    <p className="text-white text-2xl font-bold">{formatMoney(selectedProduct.price)}</p>
                                                </div>
                                                <div className="bg-[#050B14] border border-gold-accent/40 rounded-lg p-3">
                                                    <p className="text-[10px] text-gold-accent uppercase font-semibold">Estoque Disponível:</p>
                                                    <p className="text-gold-accent text-lg font-bold">{selectedProduct.stock} UNIDADES</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="space-y-2.5">
                                            <ButtonPrimary onClick={() => addProductToCart(selectedProduct)} size="lg" className="w-full py-3.5" icon="ph-shopping-cart">Adicionar à Venda</ButtonPrimary>
                                            <ButtonOutline className="w-full py-2.5" onClick={() => setSelectedProduct(null)}>Limpar Seleção</ButtonOutline>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="py-8 flex flex-col items-center justify-center opacity-50 text-center">
                                        <i className="ph ph-HandTap text-4xl mb-2 text-gold-accent"></i>
                                        <p className="text-sm font-medium text-white">Selecione um produto abaixo ou passe no leitor</p>
                                    </div>
                                )}

                                <div className="mt-6 pt-5 border-t border-panel-border">
                                    <div className="flex justify-between items-center mb-3">
                                        <span className="text-xs font-bold text-text-muted uppercase tracking-wider">Catálogo Rápido</span>
                                        <span className="text-xs text-text-muted">{filteredCatalog.length} itens</span>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-52 overflow-y-auto custom-scrollbar pr-1">
                                        {filteredCatalog.map(p => (
                                            <button 
                                                key={p.id} 
                                                type="button"
                                                onClick={() => setSelectedProduct(p)}
                                                onDoubleClick={() => addProductToCart(p)}
                                                className={`p-2.5 rounded-lg border text-left transition-all flex items-center justify-between gap-2 ${selectedProduct?.id === p.id ? 'bg-primary-blue/15 border-primary-blue' : 'bg-[#050B14] border-[#1A233A] hover:border-text-muted'}`}
                                            >
                                                <div className="min-w-0">
                                                    <p className="text-xs font-semibold text-white truncate">{p.name}</p>
                                                    <p className="text-[10px] text-text-muted">{p.stock} un.</p>
                                                </div>
                                                <span className="text-xs font-bold text-gold-accent shrink-0">{formatMoney(p.price)}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="xl:col-span-7 glass-panel flex flex-col overflow-hidden">
                            <div className="p-5 border-b border-[#1A233A] flex justify-between items-center bg-[#0A1222]">
                                <h3 className="text-lg font-bold text-white">Lista de Venda</h3>
                                <span className="text-xs bg-primary-blue/20 text-primary-blue px-3 py-1 rounded-full font-semibold">
                                    {cart.reduce((a,b)=>a+b.qty, 0)} itens
                                </span>
                            </div>
                            
                            <div className="overflow-x-auto overflow-y-auto p-4 sm:p-6 custom-scrollbar bg-[#050B14]/30 max-h-[38vh] min-h-[180px]">
                                {cart.length === 0 ? (
                                    <div className="h-36 flex flex-col items-center justify-center opacity-30">
                                        <i className="ph ph-shopping-cart-simple text-5xl mb-3"></i>
                                        <p className="text-sm">Carrinho vazio. Adicione produtos para vender.</p>
                                    </div>
                                ) : (
                                    <table className="w-full text-left text-sm whitespace-nowrap">
                                        <thead>
                                            <tr className="text-text-muted border-b border-[#1A233A]">
                                                <th className="pb-3 px-2">#</th>
                                                <th className="pb-3 px-2">Produto</th>
                                                <th className="pb-3 px-2 text-center">Qtd</th>
                                                <th className="pb-3 px-2 text-right">Unitário</th>
                                                <th className="pb-3 px-2 text-right">Subtotal</th>
                                                <th className="pb-3 px-2"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {cart.map((item, idx) => (
                                                <tr key={item.id} className="border-b border-[#1A233A]/50">
                                                    <td className="py-3.5 px-2 text-text-muted">{idx + 1}.</td>
                                                    <td className="py-3.5 px-2 text-white font-medium">{item.name}</td>
                                                    <td className="py-3.5 px-2 text-center">
                                                        <div className="inline-flex items-center bg-[#0A1222] border border-[#1A233A] rounded-md">
                                                            <button onClick={() => {
                                                                playPosSound('beep');
                                                                if(item.qty > 1) setCart(c => c.map((it, i) => i === idx ? {...it, qty: it.qty - 1} : it));
                                                                else setCart(c => c.filter((_, i) => i !== idx));
                                                            }} className="px-2 py-1 hover:bg-[#1A233A] text-text-muted hover:text-white"><i className="ph ph-minus"></i></button>
                                                            <span className="w-8 text-center text-white text-xs font-bold">{item.qty}</span>
                                                            <button onClick={() => {
                                                                if(item.qty < item.stock) {
                                                                    playPosSound('beep');
                                                                    setCart(c => c.map((it, i) => i === idx ? {...it, qty: it.qty + 1} : it));
                                                                } else {
                                                                    playPosSound('error');
                                                                    toast.error("Estoque máximo atingido.");
                                                                }
                                                            }} className="px-2 py-1 hover:bg-[#1A233A] text-text-muted hover:text-white"><i className="ph ph-plus"></i></button>
                                                        </div>
                                                    </td>
                                                    <td className="py-3.5 px-2 text-right text-text-muted">{formatMoney(item.price)}</td>
                                                    <td className="py-3.5 px-2 text-right text-white font-semibold">{formatMoney(item.price * item.qty)}</td>
                                                    <td className="py-3.5 px-2 text-right">
                                                        <button onClick={() => setCart(c => c.filter((_, i) => i !== idx))} className="text-red-400 hover:text-red-300 p-1.5 rounded-md hover:bg-red-500/10"><i className="ph ph-trash"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                            
                            <div className="p-4 sm:p-6 border-t border-[#1A233A] bg-[#0A1222]">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
                                    <div className="sm:col-span-2">
                                        <label className="text-xs text-text-muted font-medium uppercase tracking-wider mb-1.5 block">Forma de Pagamento</label>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                            {['PIX', 'Crédito', 'Débito', 'Dinheiro'].map(type => (
                                                <button key={type} type="button" onClick={()=>setPayment(type)} className={`py-2.5 px-2 rounded-lg border text-xs font-semibold transition-all ${payment === type ? 'bg-primary-blue text-white border-primary-blue' : 'bg-[#050B14] border-[#1A233A] text-text-muted hover:text-white'}`}>
                                                    {type}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <InputField label="Desconto (R$)" type="number" step="0.01" min="0" value={discount} onChange={e=>setDiscount(e.target.value)} placeholder="0.00"/>
                                    {payment === 'Dinheiro' ? (
                                        <InputField label="Valor Recebido (R$)" type="number" step="0.01" value={received} onChange={e=>setReceived(e.target.value)} placeholder="0.00" />
                                    ) : <div className="hidden lg:block"></div>}
                                </div>
                                
                                <div className="bg-[#050B14] rounded-xl p-4 sm:p-5 border border-[#1A233A] mb-5">
                                    <div className="flex justify-between items-center text-sm mb-1.5">
                                        <span className="text-text-muted">Subtotal</span>
                                        <span className="text-white font-medium">{formatMoney(subtotal)}</span>
                                    </div>
                                    {discountVal > 0 && (
                                        <div className="flex justify-between items-center text-sm mb-1.5 text-green-400">
                                            <span>Desconto Aplicado</span>
                                            <span>- {formatMoney(discountVal)}</span>
                                        </div>
                                    )}
                                    {cardSurcharge > 0 && (
                                        <div className="flex justify-between items-center text-sm mb-1.5 text-gold-accent">
                                            <span>Taxa Cartão (6%)</span>
                                            <span>+ {formatMoney(cardSurcharge)}</span>
                                        </div>
                                    )}
                                    <div className="h-px w-full bg-[#1A233A] my-3"></div>
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <span className="text-xs font-bold text-text-muted uppercase tracking-wider block">Total Geral</span>
                                            {payment === 'Dinheiro' && received && parseFloat(received) >= total && (
                                                <span className="text-xs text-green-400 font-semibold block mt-1">Troco: {formatMoney(parseFloat(received) - total)}</span>
                                            )}
                                        </div>
                                        <span className="text-2xl sm:text-3xl font-bold text-gold-accent">{formatMoney(total)}</span>
                                    </div>
                                </div>
                                
                                <ButtonPrimary className="w-full py-4 text-base font-bold shadow-lg shadow-primary-blue/20" disabled={cart.length === 0 || isProcessing} onClick={finalizeSale} icon="ph-check-circle">
                                    {isProcessing ? 'Registrando Venda...' : 'Finalizar Venda'}
                                </ButtonPrimary>
                            </div>
                        </div>
                    </div>

                    <Modal 
                        open={movementModal.open} 
                        onClose={() => setMovementModal({ ...movementModal, open: false })}
                        title={movementModal.type === 'withdrawal' ? 'Registrar Sangria (Retirada)' : 'Registrar Reforço (Suprimento)'}
                        subtitle="A movimentação ficará gravada no turno e no histórico."
                    >
                        <form onSubmit={submitCashMovement} className="space-y-4">
                            <InputField 
                                label="Valor em Dinheiro (R$)" 
                                type="number" 
                                step="0.01" 
                                min="0.01" 
                                value={movementModal.amount} 
                                onChange={e => setMovementModal({...movementModal, amount: e.target.value})} 
                                placeholder="0.00" 
                                required 
                            />
                            <InputField 
                                label="Motivo / Observação" 
                                value={movementModal.reason} 
                                onChange={e => setMovementModal({...movementModal, reason: e.target.value})} 
                                placeholder="Ex: Pagamento fornecedor / Troco extra" 
                                required 
                            />
                            <div className="flex justify-end gap-3 pt-3">
                                <ButtonOutline onClick={() => setMovementModal({ ...movementModal, open: false })}>Cancelar</ButtonOutline>
                                <ButtonPrimary type="submit" icon="ph-check">Confirmar Registro</ButtonPrimary>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        // =====================================================================
        // 3. CAIXAS E TURNOS (COM LIMPEZA DE QUEM ABRIU CAIXA E SANGRIAS)
        // =====================================================================
        const SessionsManager = ({ sessions = [], cashMovements = [], currentUser, onNavigate }) => {
            const toast = useToast();
            const activeSession = sessions.find(s => s.status === 'open' && s.operator === currentUser.email);
            const [counted, setCounted] = useState('');
            const [confirmClearModal, setConfirmClearModal] = useState(null); // 'sessions' | 'movements'
            const [clearing, setClearing] = useState(false);

            const handleCloseSession = async () => {
                if (counted === '' || isNaN(counted)) {
                    toast.error("Informe o valor em dinheiro contado na gaveta para fechar o turno.");
                    return;
                }
                try {
                    const sessionRef = window.fb.doc(window.firebaseDb, 'sessions', activeSession.id);
                    await window.fb.updateDoc(sessionRef, {
                        status: 'closed',
                        closedAt: new Date().toISOString(),
                        counted: parseFloat(counted)
                    });
                    await recordHistory(currentUser, "Fechou o Caixa", `Fundo inicial: ${formatMoney(activeSession.opening)} | Contado no fechamento: ${formatMoney(counted)}`);
                    toast.success("Caixa encerrado com sucesso!");
                    setCounted('');
                } catch(e) {
                    toast.error("Erro ao fechar caixa: " + e.message);
                }
            };

            const deleteSingleSession = async (sessionId) => {
                try {
                    await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'sessions', sessionId));
                    toast.success("Registro de turno apagado!");
                } catch (e) {
                    toast.error("Erro ao apagar turno.");
                }
            };

            const executeClearData = async () => {
                if (!confirmClearModal) return;
                setClearing(true);
                try {
                    if (confirmClearModal === 'sessions') {
                        const count = await wipeCollectionDocs('sessions');
                        toast.success(`${count} registro(s) de quem abriu o caixa foram limpos!`);
                    } else if (confirmClearModal === 'movements') {
                        const count = await wipeCollectionDocs('cashMovements');
                        toast.success(`${count} registro(s) de sangria/reforço foram limpos!`);
                    }
                    setConfirmClearModal(null);
                } catch (e) {
                    toast.error("Erro ao limpar dados: " + e.message);
                }
                setClearing(false);
            };

            return (
                <div className="fade-in pb-10">
                    <PageHeader 
                        title="Caixas e Turnos" 
                        subtitle="Histórico de aberturas, fechamentos e movimentações de gaveta."
                        action={
                            currentUser?.isProgrammer && (
                                <>
                                    {sessions.length > 0 && (
                                        <ButtonOutline icon="ph-trash" className="border-red-500/40 text-red-400 hover:bg-red-500/10" onClick={() => setConfirmClearModal('sessions')}>
                                            Limpar Quem Abriu Caixa
                                        </ButtonOutline>
                                    )}
                                    {cashMovements.length > 0 && (
                                        <ButtonOutline icon="ph-trash" className="border-red-500/40 text-red-400 hover:bg-red-500/10" onClick={() => setConfirmClearModal('movements')}>
                                            Limpar Sangrias/Reforços
                                        </ButtonOutline>
                                    )}
                                </>
                            )
                        }
                    />
                    
                    {activeSession ? (
                        <div className="glass-panel p-6 mb-8 border-l-4 border-l-green-500">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"></span>
                                        <h3 className="text-xl font-bold text-white">Caixa Aberto em Operação</h3>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-1.5 mt-3 text-sm">
                                        <p className="text-text-muted">Operador: <span className="text-white font-medium">{activeSession.operatorName} ({activeSession.operator})</span></p>
                                        <p className="text-text-muted">Abertura: <span className="text-white font-medium">{new Date(activeSession.openedAt).toLocaleString()}</span></p>
                                        <p className="text-text-muted">Fundo Inicial: <span className="text-gold-accent font-bold">{formatMoney(activeSession.opening)}</span></p>
                                    </div>
                                </div>
                                <div className="bg-[#050B14] p-4 rounded-xl border border-[#1A233A] w-full md:w-auto">
                                    <p className="text-xs text-text-muted uppercase font-bold mb-2">Fechar Turno Atual</p>
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        <input type="number" step="0.01" placeholder="Dinheiro contado (R$)" value={counted} onChange={e=>setCounted(e.target.value)} className="input-dark p-2.5 rounded-lg text-sm w-full sm:w-48"/>
                                        <ButtonOutline className="border-red-500/50 text-red-400 hover:bg-red-500/10" icon="ph-lock-key" onClick={handleCloseSession}>Encerrar Caixa</ButtonOutline>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-panel p-6 mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 rounded-full bg-[#050B14] border border-[#1A233A] flex items-center justify-center text-text-muted"><i className="ph ph-wallet text-xl"></i></div>
                                <div>
                                    <h3 className="text-lg font-bold text-white">Nenhum turno aberto para seu usuário</h3>
                                    <p className="text-sm text-text-muted">Abra o caixa no Ponto de Venda para registrar vendas.</p>
                                </div>
                            </div>
                            <ButtonPrimary onClick={() => onNavigate('caixa')} icon="ph-arrow-right">Ir para Ponto de Venda</ButtonPrimary>
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="glass-panel p-0 overflow-hidden flex flex-col h-[460px]">
                            <div className="p-5 border-b border-[#1A233A] bg-[#0A1222] flex justify-between items-center">
                                <h3 className="text-base font-semibold text-white">Histórico de Turnos (Quem Abriu o Caixa)</h3>
                                <span className="text-xs text-text-muted">{sessions.length} registros</span>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                {sessions.length === 0 ? <div className="p-10 text-center opacity-50"><p>Nenhum turno registrado.</p></div> : 
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-[#050B14] sticky top-0">
                                        <tr>
                                            <th className="px-5">Operador / Horário</th>
                                            <th className="px-5">Status</th>
                                            <th className="px-5 text-right">Valores</th>
                                            {currentUser?.isProgrammer && <th className="px-3 text-right"></th>}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {[...sessions].sort((a,b)=>new Date(b.openedAt)-new Date(a.openedAt)).map(s => (
                                            <tr key={s.id} className="border-b border-[#1A233A]/50">
                                                <td className="px-5 py-3.5">
                                                    <div className="font-medium text-white">{s.operatorName || s.operator}</div>
                                                    <div className="text-xs text-text-muted">{new Date(s.openedAt).toLocaleString()}</div>
                                                </td>
                                                <td className="px-5 py-3.5">
                                                    <span className={`px-2 py-1 rounded text-xs font-medium ${s.status==='open'?'bg-green-500/10 text-green-400':'bg-white/5 text-text-muted'}`}>
                                                        {s.status === 'open' ? 'Aberto' : 'Fechado'}
                                                    </span>
                                                </td>
                                                <td className="px-5 py-3.5 text-right">
                                                    <div className="text-xs text-text-muted">Abertura: {formatMoney(s.opening)}</div>
                                                    {s.status === 'closed' && <div className="text-xs text-white font-semibold">Contado: {formatMoney(s.counted)}</div>}
                                                </td>
                                                {currentUser?.isProgrammer && (
                                                    <td className="px-3 py-3.5 text-right">
                                                        <button onClick={() => deleteSingleSession(s.id)} className="text-red-400 hover:text-red-300 p-1.5 rounded hover:bg-red-500/10" title="Apagar este registro de caixa">
                                                            <i className="ph ph-trash"></i>
                                                        </button>
                                                    </td>
                                                )}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>}
                            </div>
                        </div>

                        <div className="glass-panel p-0 overflow-hidden flex flex-col h-[460px]">
                            <div className="p-5 border-b border-[#1A233A] bg-[#0A1222] flex justify-between items-center">
                                <h3 className="text-base font-semibold text-white">Sangrias e Reforços</h3>
                                <span className="text-xs text-text-muted">{cashMovements.length} registros</span>
                            </div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar">
                                {cashMovements.length === 0 ? <div className="p-10 text-center opacity-50"><p>Nenhuma movimentação registrada.</p></div> : 
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-[#050B14] sticky top-0">
                                        <tr><th className="px-5">Data/Hora</th><th className="px-5">Tipo / Motivo</th><th className="px-5 text-right">Valor</th></tr>
                                    </thead>
                                    <tbody>
                                        {[...cashMovements].sort((a,b)=>new Date(b.at)-new Date(a.at)).map(m => (
                                            <tr key={m.id} className="border-b border-[#1A233A]/50">
                                                <td className="px-5 py-3.5 text-xs text-text-muted">{new Date(m.at).toLocaleString()}</td>
                                                <td className="px-5 py-3.5">
                                                    <span className={`px-2 py-0.5 rounded text-xs font-medium ${m.type === 'withdrawal' ? 'bg-red-500/10 text-red-400' : 'bg-green-500/10 text-green-400'}`}>
                                                        {m.type === 'withdrawal' ? 'Sangria' : 'Reforço'}
                                                    </span>
                                                    <span className="block text-xs text-text-light mt-1">{m.reason || '-'}</span>
                                                </td>
                                                <td className={`px-5 py-3.5 text-right font-bold ${m.type === 'withdrawal' ? 'text-red-400' : 'text-green-400'}`}>
                                                    {m.type === 'withdrawal' ? '-' : '+'} {formatMoney(m.amount)}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>}
                            </div>
                        </div>
                    </div>

                    <Modal 
                        open={!!confirmClearModal} 
                        onClose={() => setConfirmClearModal(null)} 
                        title={confirmClearModal === 'sessions' ? "Limpar Todos os Registros de Caixa?" : "Limpar Sangrias e Reforços?"}
                        subtitle="Ação irreversível exclusiva do Programador Geral."
                    >
                        <p className="text-sm text-text-light mb-6">
                            {confirmClearModal === 'sessions' 
                                ? "Isso apagará todos os turnos abertos e fechados (histórico de quem abriu o caixa)." 
                                : "Isso apagará todo o histórico de sangrias e reforços registrados."}
                        </p>
                        <div className="flex justify-end gap-3">
                            <ButtonOutline onClick={() => setConfirmClearModal(null)} disabled={clearing}>Cancelar</ButtonOutline>
                            <ButtonPrimary className="bg-red-600 hover:bg-red-700" onClick={executeClearData} disabled={clearing} icon="ph-trash">
                                {clearing ? 'Limpando...' : 'Confirmar Limpeza'}
                            </ButtonPrimary>
                        </div>
                    </Modal>
                </div>
            );
        };

        // =====================================================================
        // 4. GESTÃO DE PRODUTOS (COM BOTÃO DE LIMPAR TODOS OS PRODUTOS)
        // =====================================================================
        const ProductManager = ({ products = [], settings = {}, currentUser }) => {
            const toast = useToast();
            const [form, setForm] = useState({ id: '', name: '', barcode: '', price: '', cost: '', stock: '', category: '', brand: '', imageUrl: '' });
            const [isSaving, setIsSaving] = useState(false);
            const [uploadingImg, setUploadingImg] = useState(false);
            const [deleteTarget, setDeleteTarget] = useState(null);
            const [confirmWipeProducts, setConfirmWipeProducts] = useState(false);
            const [wiping, setWiping] = useState(false);

            const r2Config = { ...DEFAULT_R2_CONFIG, ...(settings.r2Config || {}) };
            const s3 = useMemo(() => createR2Client(r2Config), [r2Config.accountId, r2Config.accessKeyId, r2Config.secretAccessKey]);

            const handleImageUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                setUploadingImg(true);

                // Verifica o uso real antes de permitir subir foto de produto (Trava em 9,5 GB)
                s3.listObjectsV2({ Bucket: r2Config.bucket.trim() }, (listErr, data) => {
                    if (!listErr && data?.Contents) {
                        const currentBytes = data.Contents.reduce((acc, item) => acc + (item.Size || 0), 0);
                        if (currentBytes >= R2_BLOCK_LIMIT_BYTES || (currentBytes + file.size) > R2_BLOCK_LIMIT_BYTES) {
                            setUploadingImg(false);
                            toast.error("Upload bloqueado! O limite de segurança de 9,5 GB foi atingido para proteger os 10 GB gratuitos.");
                            e.target.value = '';
                            return;
                        }
                    }

                    const fileKey = `produtos/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                    s3.putObject({
                        Bucket: r2Config.bucket,
                        Key: fileKey,
                        Body: file,
                        ContentType: file.type
                    }, (err) => {
                        setUploadingImg(false);
                        if (err) {
                            toast.error("Erro ao enviar imagem para o Cloud R2.");
                        } else {
                            const url = `${r2Config.publicUrl.replace(/\/$/, '')}/${fileKey}`;
                            setForm(prev => ({ ...prev, imageUrl: url }));
                            toast.success("Foto do produto enviada para o Cloud R2!");
                        }
                    });
                });
            };

            const handleSave = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                try {
                    const payload = {
                        name: form.name.trim(),
                        barcode: form.barcode.trim() || String(Math.floor(100000000000 + Math.random() * 900000000000)),
                        price: parseFloat(form.price),
                        cost: parseFloat(form.cost || 0),
                        stock: parseInt(form.stock),
                        category: (form.category || '').trim(),
                        brand: (form.brand || '').trim(),
                        imageUrl: form.imageUrl || '',
                        active: true,
                        blocked: false,
                        updatedAt: new Date().toISOString()
                    };

                    if (form.id) {
                        await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'products', form.id), payload);
                        await recordHistory(currentUser, "Editou Produto", `${payload.name} - Preço: ${formatMoney(payload.price)} | Estoque: ${payload.stock}`);
                        toast.success("Produto atualizado com sucesso!");
                    } else {
                        await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'products'), payload);
                        await recordHistory(currentUser, "Cadastrou Produto", `${payload.name} (Cód: ${payload.barcode}) - Estoque: ${payload.stock}`);
                        toast.success("Produto cadastrado no catálogo!");
                    }
                    setForm({ id: '', name: '', barcode: '', price: '', cost: '', stock: '', category: '', brand: '', imageUrl: '' });
                } catch(err) {
                    toast.error("Erro ao salvar produto: " + err.message);
                }
                setIsSaving(false);
            };

            const confirmDeleteProduct = async () => {
                if (!deleteTarget) return;
                try {
                    await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'products', deleteTarget.id));
                    await recordHistory(currentUser, "Excluiu Produto", `${deleteTarget.name}`);
                    toast.success("Produto removido do catálogo.");
                    setDeleteTarget(null);
                } catch(e) {
                    toast.error("Erro ao excluir produto.");
                }
            };

            const handleWipeAllProducts = async () => {
                setWiping(true);
                try {
                    const count = await wipeCollectionDocs('products');
                    toast.success(`${count} produto(s) excluído(s)! Catálogo zerado.`);
                    setConfirmWipeProducts(false);
                } catch (e) {
                    toast.error("Erro ao limpar produtos: " + e.message);
                }
                setWiping(false);
            };

            return (
                <div className="fade-in pb-10">
                    <PageHeader 
                        title="Gestão de Produtos" 
                        subtitle="Cadastre produtos, conecte leitor de código de barras e controle o estoque."
                        action={
                            currentUser?.isProgrammer && products.length > 0 && (
                                <ButtonOutline icon="ph-trash" className="border-red-500/40 text-red-400 hover:bg-red-500/10" onClick={() => setConfirmWipeProducts(true)}>
                                    Limpar Todos os Produtos ({products.length})
                                </ButtonOutline>
                            )
                        }
                    />
                    
                    <div className="glass-panel p-6 mb-8">
                        <div className="flex justify-between items-center mb-5">
                            <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                <i className="ph ph-package text-primary-blue"></i> {form.id ? 'Editar Produto' : 'Novo Produto'}
                            </h3>
                            {form.id && (
                                <ButtonOutline size="sm" onClick={() => setForm({ id: '', name: '', barcode: '', price: '', cost: '', stock: '', category: '', brand: '', imageUrl: '' })}>
                                    Cancelar Edição
                                </ButtonOutline>
                            )}
                        </div>
                        <form onSubmit={handleSave} className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4 items-end">
                            <div className="lg:col-span-3"><InputField label="Nome do Produto" value={form.name} onChange={e=>setForm({...form, name: e.target.value})} placeholder="Ex: Fone Bluetooth X1" required/></div>
                            <div className="lg:col-span-2"><InputField label="Cód. de Barras (Scanner)" value={form.barcode} onChange={e=>setForm({...form, barcode: e.target.value})} placeholder="Automático se vazio"/></div>
                            <div className="lg:col-span-2"><InputField label="Categoria (opcional)" list="product-categories" value={form.category || ''} onChange={e=>setForm({...form, category: e.target.value})} placeholder="Selecione ou digite"/><datalist id="product-categories">{storeNames([...(settings.storeCategories ?? DEFAULT_STORE_CATEGORIES), ...products.map(p=>p.category)]).map(n=><option key={n} value={n}/>)}</datalist></div>
                            <div className="lg:col-span-2"><InputField label="Marca (opcional)" list="product-brands" value={form.brand || ''} onChange={e=>setForm({...form, brand: e.target.value})} placeholder="Selecione ou digite"/><datalist id="product-brands">{storeNames([...(settings.storeBrands || []), ...products.map(p=>p.brand)]).map(n=><option key={n} value={n}/>)}</datalist></div>
                            <div className="lg:col-span-1"><InputField label="Custo (R$)" type="number" step="0.01" value={form.cost} onChange={e=>setForm({...form, cost: e.target.value})} placeholder="0.00"/></div>
                            <div className="lg:col-span-1"><InputField label="Venda (R$)" type="number" step="0.01" value={form.price} onChange={e=>setForm({...form, price: e.target.value})} placeholder="0.00" required/></div>

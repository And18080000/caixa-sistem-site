                        {/* SUB-ABA: HISTÓRICO DE ATIVIDADES */}
                        {subTab === 'historico' && (
                            <div className="p-6">
                                <div className="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 mb-5">
                                    <input 
                                        type="text" 
                                        placeholder="Pesquisar no histórico por nome, ação ou detalhe..." 
                                        value={historyFilter} 
                                        onChange={e => setHistoryFilter(e.target.value)}
                                        className="input-dark rounded-lg p-2.5 text-sm flex-1 max-w-md"
                                    />
                                    {filteredHistory.length > 0 && (
                                        <ButtonOutline size="sm" icon="ph-trash" onClick={() => setWipeTarget({ key: 'history', title: 'Histórico de Atividades', desc: 'Isso limpará todos os registros de ações da aba Histórico.' })}>
                                            Limpar Histórico
                                        </ButtonOutline>
                                    )}
                                </div>
                                <div className="overflow-x-auto max-h-[450px] custom-scrollbar">
                                    <table className="w-full text-left text-sm whitespace-nowrap">
                                        <thead className="bg-[#050B14] sticky top-0">
                                            <tr>
                                                <th className="px-5 py-3.5">Data / Hora</th>
                                                <th className="px-5 py-3.5">Usuário</th>
                                                <th className="px-5 py-3.5">Ação Realizada</th>
                                                <th className="px-5 py-3.5">Detalhes da Atualização</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredHistory.length === 0 ? (
                                                <tr><td colSpan="4" className="text-center py-10 text-text-muted">Nenhuma atividade registrada até o momento.</td></tr>
                                            ) : (
                                                filteredHistory.map(h => (
                                                    <tr key={h.id} className="border-b border-[#1A233A]/50">
                                                        <td className="px-5 py-3.5 text-xs text-text-muted">{new Date(h.at).toLocaleString()}</td>
                                                        <td className="px-5 py-3.5">
                                                            <span className="text-white font-medium block">{h.userName}</span>
                                                            <span className="text-[10px] text-text-muted">{h.userEmail}</span>
                                                        </td>
                                                        <td className="px-5 py-3.5">
                                                            <span className="px-2.5 py-1 rounded text-xs font-semibold bg-primary-blue/15 text-blue-400">{h.action}</span>
                                                        </td>
                                                        <td className="px-5 py-3.5 text-xs text-text-light whitespace-normal max-w-md">{h.details || '-'}</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modal Criar / Editar Usuário */}
                    <Modal open={modalOpen} onClose={() => setModalOpen(false)} title={form.id ? "Editar Acesso" : "Cadastrar Novo Acesso"} subtitle="Configure os dados e decida exatamente o que este usuário poderá ver.">
                        <form onSubmit={handleSaveUser} className="space-y-4">
                            <InputField label="Nome do Usuário" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Ex: João Operador" required />
                            <InputField label="E-mail de Login" type="email" value={form.email} onChange={e => setForm({...form, email: e.target.value})} placeholder="usuario@empresa.com" disabled={!!form.id} required />
                            {!form.id && (
                                <InputField label="Senha Inicial (Mín. 6 dígitos)" type="password" value={form.password} onChange={e => setForm({...form, password: e.target.value})} placeholder="••••••" required />
                            )}
                            <div>
                                <label className="text-xs font-medium text-text-muted uppercase tracking-wider block mb-1.5">Tipo de Acesso</label>
                                <select value={form.role} onChange={e => setForm({...form, role: e.target.value})} className="input-dark rounded-lg p-3 w-full text-sm">
                                    <option value="colab">Colaborador (Acesso Personalizado)</option>
                                    <option value="admin">Administrador (Acesso Total da Empresa)</option>
                                </select>
                            </div>

                            {form.role === 'colab' && (
                                <div className="bg-[#050B14] border border-panel-border rounded-xl p-4">
                                    <p className="text-xs font-bold text-white uppercase tracking-wider mb-3">Decida quais abas este colaborador poderá ver:</p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                        {selectableTabs.map(tab => (
                                            <label key={tab.id} className="flex items-center gap-2.5 text-xs text-text-light cursor-pointer p-2 rounded hover:bg-white/5">
                                                <input 
                                                    type="checkbox" 
                                                    checked={form.permissions.includes(tab.id)} 
                                                    onChange={() => togglePermission(tab.id)}
                                                    className="accent-primary-blue w-4 h-4"
                                                />
                                                <i className={`ph ${tab.icon} text-base text-gold-accent`}></i>
                                                <span>{tab.label}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-end gap-3 pt-3">
                                <ButtonOutline onClick={() => setModalOpen(false)}>Cancelar</ButtonOutline>
                                <ButtonPrimary type="submit" disabled={saving} icon="ph-check">{saving ? 'Salvando...' : 'Salvar Acesso'}</ButtonPrimary>
                            </div>
                        </form>
                    </Modal>

                    {/* Modal Confirmar Exclusão de Usuário */}
                    <Modal open={!!deleteUserModal} onClose={() => setDeleteUserModal(null)} title="Excluir Acesso?" subtitle="O usuário perderá imediatamente o acesso ao sistema.">
                        <p className="text-sm text-text-light mb-6">Deseja realmente remover o acesso de <strong className="text-white">{deleteUserModal?.name}</strong>?</p>
                        <div className="flex justify-end gap-3">
                            <ButtonOutline onClick={() => setDeleteUserModal(null)}>Cancelar</ButtonOutline>
                            <ButtonPrimary className="bg-red-600 hover:bg-red-700" onClick={confirmDeleteUser} icon="ph-trash">Confirmar Exclusão</ButtonPrimary>
                        </div>
                    </Modal>

                    {/* Modal Confirmar Limpeza de Dados do Sistema */}
                    <Modal open={!!wipeTarget} onClose={() => setWipeTarget(null)} title={`Limpar: ${wipeTarget?.title}?`} subtitle="Ação irreversível exclusiva do Programador Geral.">
                        <p className="text-sm text-text-light mb-6 leading-relaxed">{wipeTarget?.desc}</p>
                        <div className="flex justify-end gap-3">
                            <ButtonOutline onClick={() => setWipeTarget(null)} disabled={isWipingData}>Cancelar</ButtonOutline>
                            <ButtonPrimary className="bg-red-600 hover:bg-red-700" onClick={handleConfirmWipe} disabled={isWipingData} icon="ph-trash">
                                {isWipingData ? 'Limpando Dados...' : 'Confirmar Limpeza Definitiva'}
                            </ButtonPrimary>
                        </div>
                    </Modal>
                </div>
            );
        };

        // =====================================================================
        // 8.4. NOVA ABA: LOJA E-COMMERCE & INTEGRAÇÃO MERCADO PAGO
        // =====================================================================

        const StoreProductTags = ({ product, categories, brands }) => {
            const toast = useToast();
            const [category,setCategory] = useState(product.category || '');
            const [brand,setBrand] = useState(product.brand || '');
            const [busy,setBusy] = useState(false);
            useEffect(()=>{setCategory(product.category || '');setBrand(product.brand || '');},[product.category,product.brand]);
            const save = async () => {
                setBusy(true);
                try {
                    await window.fb.updateDoc(window.fb.doc(window.firebaseDb,'products',product.id), {category:category.trim(),brand:brand.trim(),updatedAt:new Date().toISOString()});
                    toast.success('Categoria e marca atualizadas.');
                } catch(e){toast.error('Não foi possível salvar: '+e.message);} finally {setBusy(false);}
            };
            return <div className="grid grid-cols-1 md:grid-cols-5 gap-3 items-end py-3 border-b border-panel-border">
                <div><strong className="text-sm text-white">{product.name}</strong><p className="text-xs text-text-muted">Estoque do caixa: {product.stock || 0} un.</p></div>
                <InputField label="Categoria opcional" list="store-categories" value={category} onChange={e=>setCategory(e.target.value)}/>
                <InputField label="Marca opcional" list="store-brands" value={brand} onChange={e=>setBrand(e.target.value)}/>
                <div className="text-xs text-text-muted">Preço e estoque são gerenciados em Gestão de Produtos.</div>
                <ButtonOutline onClick={save} disabled={busy}>{busy?'Salvando...':'Salvar produto'}</ButtonOutline>
            </div>;
        };
        const StoreVisualSettings = ({ settings, products }) => {
            const toast = useToast();
            const initial = () => ({storeCategories:settings.storeCategories ?? DEFAULT_STORE_CATEGORIES,storeBrands:settings.storeBrands || [],storeBannerImage:settings.storeBannerImage || '',storeBannerPosition:settings.storeBannerPosition || 'center',storeBannerOverlay:settings.storeBannerOverlay !== false,storeAnnouncement:settings.storeAnnouncement ?? 'Compre com segurança • PIX e cartões pelo Mercado Pago'});
            const [draft,setDraft]=useState(initial);
            const [dirty,setDirty]=useState(false);
            const [category,setCategory]=useState('');
            const [brand,setBrand]=useState('');
            const [busy,setBusy]=useState(false);
            const [query,setQuery]=useState('');
            useEffect(()=>{if(!dirty) setDraft(initial());},[settings,dirty]);
            const change=(key,value)=>{setDirty(true);setDraft(p=>({...p,[key]:value}));};
            const add=(key,value,clear)=>{if(!value.trim())return;change(key,storeNames([...draft[key],value]));clear('');};
            const upload=async(e)=>{
                const file=e.target.files?.[0]; if(!file)return;
                e.target.value='';
                if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast.error('Use JPG, PNG ou WebP.');
                if(file.size>15*1024*1024)return toast.error('Escolha uma imagem de até 15 MB.');
                setBusy(true);
                let url;
                try {
                    url=URL.createObjectURL(file);
                    const img=new Image();img.src=url;await img.decode();
                    const scale=Math.min(1,1600/img.width,800/img.height);
                    const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
                    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                    let data=canvas.toDataURL('image/jpeg',.85);
                    for(let q=.7;data.length>350000 && q>=.25;q-=.15)data=canvas.toDataURL('image/jpeg',q);
                    if(data.length>350000)throw new Error('Imagem muito detalhada. Use uma imagem menor.');
                    change('storeBannerImage',data);toast.success('Banner preparado. Clique em Salvar visual da loja.');
                }catch(err){toast.error('Erro no banner: '+err.message);}finally{if(url)URL.revokeObjectURL(url);setBusy(false);}
            };
            const save=async()=>{
                if(draft.storeBannerImage && !/^(https?:\/\/|data:image\/(jpeg|png|webp);base64,)/i.test(draft.storeBannerImage))return toast.error('Use uma URL http/https ou envie a imagem.');

                try {
                    await window.fb.setDoc(window.fb.doc(window.firebaseDb,'settings','geral'),{...draft,storeCategories:storeNames(draft.storeCategories),storeBrands:storeNames(draft.storeBrands),updatedAt:new Date().toISOString()},{merge:true});
                    setDirty(false);toast.success('Visual, categorias e marcas salvos na loja.');
                }catch(e){toast.error('Erro ao salvar visual: '+e.message);}finally{setBusy(false);}
            };
            const cats=storeNames([...draft.storeCategories,...products.map(p=>p.category)]);
            const brands=storeNames([...draft.storeBrands,...products.map(p=>p.brand)]);
            return <section className="glass-panel p-5 sm:p-7 space-y-5">
                <div><h3 className="text-lg text-white font-bold">Vitrine • Banner, categorias e marcas</h3><p className="text-xs text-text-muted mt-1">Categorias e marcas cadastradas aparecem mesmo sem produtos. O estoque continua sendo o do caixa.</p></div>

                    {draft.storeBannerOverlay && <><span className="text-xs text-gold-accent">⚡ ESTOQUE SINCRONIZADO EM TEMPO REAL</span><h3 className="text-3xl font-extrabold text-white mt-3">{settings.storeTitle || 'Loja Online A&M'}</h3><p className="text-sm text-slate-300">{settings.storeBannerText || 'Compre online com segurança e receba rapidamente.'}</p></>}
                </div>
                <div className="grid md:grid-cols-2 gap-4">
                    <div><label className="block text-xs text-text-muted mb-2">Enviar banner (JPG, PNG ou WebP; recomendado 1600 × 320)</label><input type="file" accept="image/jpeg,image/png,image/webp" onChange={upload} disabled={busy} className="text-xs w-full"/></div>
                    <InputField label="Ou endereço da imagem do banner" value={draft.storeBannerImage.startsWith('data:') ? '' : draft.storeBannerImage} placeholder="https://.../banner.jpg" onChange={e=>change('storeBannerImage',e.target.value)}/>
                    <InputField label="Faixa superior da loja" value={draft.storeAnnouncement} onChange={e=>change('storeAnnouncement',e.target.value)}/>
                    <div><label className="text-xs text-text-muted block mb-2">Enquadramento do banner</label><select className="input-dark w-full p-3 rounded-lg" value={draft.storeBannerPosition} onChange={e=>change('storeBannerPosition',e.target.value)}><option value="center">Centro</option><option value="top">Topo</option><option value="bottom">Base</option></select></div>
                    <label className="text-sm flex gap-2 items-center"><input type="checkbox" checked={draft.storeBannerOverlay} onChange={e=>change('storeBannerOverlay',e.target.checked)}/>Exibir nome e mensagem sobre o banner</label>
                    <ButtonOutline onClick={()=>change('storeBannerImage','')}>Restaurar banner padrão</ButtonOutline>
                </div>
                <div className="grid md:grid-cols-2 gap-6">
                    {[['storeCategories','Categorias',category,setCategory],['storeBrands','Marcas',brand,setBrand]].map(([key,label,value,setValue])=><div key={key} className="bg-[#050B14] rounded-xl p-4 border border-panel-border">
                        <h4 className="font-bold mb-3">{label}</h4><div className="flex gap-2"><input aria-label={'Nova '+label} className="input-dark p-2 rounded-lg w-full min-w-0" placeholder={'Adicionar em '+label.toLowerCase()} maxLength="60" value={value} onChange={e=>setValue(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();add(key,value,setValue);}}}/><ButtonOutline onClick={()=>add(key,value,setValue)}>Adicionar</ButtonOutline></div>
                        <div className="flex flex-wrap gap-2 mt-3">{draft[key].map(n=><span key={n} className="text-xs bg-[#1a2639] border border-panel-border rounded-full px-3 py-2">{n}<button type="button" aria-label={'Remover '+n} className="ml-3 text-red-300" onClick={()=>change(key,draft[key].filter(v=>v!==n))}>×</button></span>)}</div>
                        <p className="text-xs text-text-muted mt-3">{label} vinculadas a produtos continuam visíveis até que o vínculo seja alterado.</p>
                    </div>)}
                </div>
                <div className="flex justify-end"><ButtonPrimary onClick={save} disabled={busy}>{busy?'Preparando...':dirty?'Salvar visual da loja • alterações pendentes':'Salvar visual da loja'}</ButtonPrimary></div>
                <details className="border-t border-panel-border pt-4"><summary className="cursor-pointer font-bold">Classificar produtos da loja ({products.length})</summary>
                    <input className="input-dark p-3 rounded-lg mt-4 w-full" placeholder="Localizar produto pelo nome" value={query} onChange={e=>setQuery(e.target.value)}/>
                    <datalist id="store-categories">{cats.map(n=><option value={n} key={n}/>)}</datalist><datalist id="store-brands">{brands.map(n=><option value={n} key={n}/>)}</datalist>
                    {products.filter(p=>p.name?.toLowerCase().includes(query.toLowerCase())).map(p=><StoreProductTags key={p.id} product={p} categories={cats} brands={brands}/>)}
                    {!products.length && <p className="text-sm text-text-muted py-5">Cadastre produtos em Gestão de Produtos. As categorias acima já podem ser exibidas na vitrine.</p>}
                </details>
            </section>;
        };

        const EcommerceManager = ({ products = [], sales = [], orders = [], settings = {}, currentUser }) => {

                    </div>

                    {/* Guia Rápido de Instalação no Celular, Tablet ou Computador */}
                    <div className="glass-panel p-6">
                        <h3 className="text-base font-bold text-white mb-4 flex items-center gap-2">
                            <i className="ph ph-download-simple text-primary-blue"></i> Como instalar o App no seu dispositivo
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                            <div className="bg-[#050B14] border border-panel-border rounded-xl p-4">
                                <strong className="text-white text-sm flex items-center gap-2 mb-1.5">
                                    <i className="ph ph-android-logo text-green-400 text-lg"></i> 1. Celular ou Tablet Android
                                </strong>
                                <p className="text-text-muted leading-relaxed">
                                    Toque no botão <strong>Abrir e Instalar Aplicativo Agora</strong> acima. No navegador Chrome, toque em <strong>Instalar App</strong> no topo ou abra o menu (3 pontos) e escolha <strong>Adicionar à tela inicial</strong>.
                                </p>
                            </div>
                            <div className="bg-[#050B14] border border-panel-border rounded-xl p-4">
                                <strong className="text-white text-sm flex items-center gap-2 mb-1.5">
                                    <i className="ph ph-apple-logo text-white text-lg"></i> 2. iPhone ou iPad (iOS)
                                </strong>
                                <p className="text-text-muted leading-relaxed">
                                    Abra o link no navegador <strong>Safari</strong>, toque no ícone de <strong>Compartilhar</strong> na barra inferior e selecione <strong>Adicionar à Tela de Início</strong> para tê-lo como aplicativo.
                                </p>
                            </div>
                            <div className="bg-[#050B14] border border-panel-border rounded-xl p-4">
                                <strong className="text-white text-sm flex items-center gap-2 mb-1.5">
                                    <i className="ph ph-desktop text-primary-blue text-lg"></i> 3. Computador / Notebook
                                </strong>
                                <p className="text-text-muted leading-relaxed">
                                    Ao abrir o link no Chrome ou Edge, clique em <strong>Instalar App</strong> no topo direito da tela para fixar o monitor de caixa direto na sua Área de Trabalho.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 9. ABA DE SUPORTE E EXPLICAÇÃO DO SISTEMA
        // =====================================================================
        const SupportTab = () => {
            const guides = [
                { num: '01', title: 'Ponto de Venda e Caixa Persistente', desc: 'Abra o caixa informando o fundo inicial. O turno permanece aberto mesmo se você trocar de aba ou atualizar a página, até que você clique em Encerrar Caixa na aba Caixas e Turnos.' },
                { num: '02', title: 'Gestão de Produtos e Scanner', desc: 'Cadastre produtos com nome, preço de custo, preço de venda, quantidade em estoque e código de barras (manual ou via leitor USB/Bluetooth).' },
                { num: '03', title: 'Gerador de Etiquetas em PDF', desc: 'Escolha produtos do estoque, personalize o tamanho em milímetros (ex: 60x40mm, 50x30mm), ajuste colunas e exporte o PDF pronto para impressão térmica ou folha adesiva.' },
                { num: '04', title: 'Desempenho Financeiro', desc: 'Acompanhe o gráfico de evolução em formato de trade (Receita vs Lucro), cadastre despesas e exporte o fechamento completo em PDF.' },
                { num: '05', title: 'Acessos e Histórico Completo', desc: 'Cadastre Administradores e Colaboradores decidindo quais abas cada colaborador pode visualizar. Na sub-aba Histórico, audite todas as ações realizadas no sistema.' },
                { num: '06', title: 'Armazenamento Cloud R2 e Engrenagem', desc: 'Envie a logo da empresa e gerencie fotos/vídeos na galeria em tempo real. Use o botão de engrenagem para visualizar ou trocar as chaves do bucket Cloud R2.' }
            ];
            return (
                <div className="fade-in pb-10">
                    <PageHeader title="Suporte e Guia do Sistema" subtitle="Explicação detalhada do funcionamento de todas as abas da plataforma." />
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {guides.map(g => (
                            <div key={g.num} className="glass-panel p-6">
                                <span className="inline-block text-xs font-bold text-gold-accent bg-gold-accent/10 border border-gold-accent/30 px-2.5 py-1 rounded mb-3">{g.num}</span>
                                <h3 className="text-base font-bold text-white mb-2">{g.title}</h3>
                                <p className="text-sm text-text-muted leading-relaxed">{g.desc}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // =====================================================================
        // COMPONENTE PRINCIPAL (APP SHELL + INSTALADOR PWA)
        // =====================================================================
        const App = () => {
            const toast = useToast();
            const [user, setUser] = useState(null);
            const [authChecking, setAuthChecking] = useState(true);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);

            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [installModalOpen, setInstallModalOpen] = useState(false);

            useEffect(() => {
                const handler = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                };
                window.addEventListener('beforeinstallprompt', handler);
                return () => window.removeEventListener('beforeinstallprompt', handler);
            }, []);

            const handleInstallClick = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        toast.success("Instalação do sistema iniciada!");
                    }
                    setDeferredPrompt(null);
                } else {
                    setInstallModalOpen(true);
                }
            };

            useEffect(() => {
                const unsubscribe = window.fb.onAuth(window.firebaseAuth, (currentUser) => {
                    setUser(currentUser); 
                    setAuthChecking(false);
                });
                return () => unsubscribe();
            }, []);

            const { data, loading: dataLoading } = useAppStore(user);

            if (authChecking) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-[#030914] text-white">
                        <div className="w-14 h-14 rounded-full border-t-2 border-primary-blue animate-spin"></div>
                        <p className="mt-4 text-text-muted tracking-widest uppercase text-xs font-bold">Carregando Caixa Sistem A&M...</p>
                    </div>
                );
            }

            if (!user) return <Login settings={data.settings} />;

            const isProgrammer = user.email?.toLowerCase() === MASTER_EMAIL || data.profile?.role === 'programador' || data.profile?.isProgrammer;
            const isAdmin = isProgrammer || data.profile?.role === 'admin';
            const isColab = !isAdmin;
            const userPermissions = data.profile?.permissions || ['dashboard', 'caixa', 'turnos', 'suporte'];
            const blockedTabs = data.settings?.blockedTabs || [];

            const visibleMenuItems = ALL_NAV_TABS.filter(item => {
                if (isProgrammer) return true; // Programador Geral vê todas as abas sempre
                if (blockedTabs.includes(item.id)) return false; // Aba bloqueada pelo Programador Geral
                if (isColab) {
                    if (['acessos', 'configuracoes', 'app_monitor'].includes(item.id)) return false;
                    return userPermissions.includes(item.id);
                }
                return true;
            });

            const currentUserInfo = {
                uid: user.uid,
                email: user.email,
                name: isProgrammer ? (data.profile?.name || 'Programador Geral') : (data.profile?.name || user.email.split('@')[0]),
                role: isProgrammer ? 'programador' : (data.profile?.role || 'colab'),
                isProgrammer
            };

            const renderContent = () => {
                if (dataLoading) {
                    return (
                        <div className="h-[60vh] flex flex-col items-center justify-center">
                            <i className="ph ph-spinner animate-spin text-4xl text-primary-blue mb-4"></i>
                            <p className="text-text-muted text-sm">Sincronizando dados em tempo real...</p>
                        </div>
                    );
                }

                if (!isProgrammer && blockedTabs.includes(activeTab)) {
                    return (
                        <div className="h-[60vh] flex flex-col items-center justify-center text-center fade-in">
                            <i className="ph ph-lock-key text-5xl text-red-400 mb-3"></i>
                            <h2 className="text-xl font-bold text-white">Módulo Temporariamente Bloqueado</h2>
                            <p className="text-sm text-text-muted mt-1">Esta aba foi bloqueada pelo Programador Geral do sistema.</p>
                        </div>
                    );
                }

                switch(activeTab) {
                    case 'dashboard': return <Dashboard sales={data.sales} products={data.products} onNavigate={setActiveTab} currentUser={currentUserInfo} />;
                    case 'caixa': return <POS products={data.products} currentUser={currentUserInfo} sessions={data.sessions} />;
                    case 'turnos': return <SessionsManager sessions={data.sessions} cashMovements={data.cashMovements} currentUser={currentUserInfo} onNavigate={setActiveTab} />;
                    case 'produtos': return <ProductManager products={data.products} settings={data.settings} currentUser={currentUserInfo} />;
                    case 'etiquetas': return <LabelGenerator products={data.products} settings={data.settings} currentUser={currentUserInfo} />;
                    case 'ecommerce': return isAdmin ? (
                        <EcommerceManager 
                            products={data.products} 
                            sales={data.sales} 
                            orders={data.orders} 
                            settings={data.settings} 
                            currentUser={currentUserInfo} 
                        />
                    ) : null;
                    case 'financeiro': return <FinancialPerformance sales={data.sales} expenses={data.expenses} settings={data.settings} currentUser={currentUserInfo} />;
                    case 'acessos': return isAdmin ? (
                        <AccessControl 
                            users={data.users} 
                            history={data.history} 
                            products={data.products}
                            sales={data.sales}
                            sessions={data.sessions}
                            cashMovements={data.cashMovements}
                            expenses={data.expenses}
                            settings={data.settings} 
                            currentUser={currentUserInfo} 
                        />
                    ) : null;
                    case 'app_monitor': return isAdmin ? <AdminMonitorAppTab currentUser={currentUserInfo} /> : null;
                    case 'configuracoes': return isAdmin ? <SettingsMedia settings={data.settings} currentUser={currentUserInfo} /> : null;
                    case 'suporte': return <SupportTab />;
                    default: return <Dashboard sales={data.sales} products={data.products} onNavigate={setActiveTab} currentUser={currentUserInfo} />;
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-app-bg text-text-light font-sans">
                    {sidebarOpen && <div className="mobile-menu-overlay md:hidden" onClick={() => setSidebarOpen(false)}></div>}

                    {/* Sidebar */}
                    <aside className={`mobile-sidebar md:relative md:translate-x-0 w-[275px] shrink-0 h-full border-r border-[#1A233A] bg-[#050B14] flex flex-col z-50 ${sidebarOpen ? 'open' : ''}`}>
                        <div className="p-6 items-center gap-3.5 flex border-b border-[#1A233A]/60">
                            <div className="w-11 h-11 rounded-xl bg-[#0A1222] border border-[#1A233A] flex items-center justify-center shadow-lg overflow-hidden shrink-0">
                                {data.settings?.logoUrl ? (
                                    <img src={data.settings.logoUrl} alt="Logo" className="w-full h-full object-contain p-1" />
                                ) : (
                                    <i className="ph-fill ph-stack text-2xl text-gold-accent"></i>
                                )}
                            </div>
                            <div className="min-w-0">
                                <h1 className="text-sm font-bold text-white truncate">{data.settings?.name || 'Caixa Sistem'}</h1>
                                <h2 className="text-[11px] font-bold text-gold-accent tracking-widest uppercase">A&M PDV</h2>
                            </div>
                            <button className="ml-auto text-text-muted hover:text-white md:hidden p-1.5" onClick={() => setSidebarOpen(false)}>
                                <i className="ph ph-x text-xl"></i>
                            </button>
                        </div>
                        
                        <nav className="flex-1 px-3.5 py-5 space-y-1 overflow-y-auto custom-scrollbar">
                            {visibleMenuItems.map(item => {
                                const isBlockedForOthers = blockedTabs.includes(item.id);
                                return (
                                    <button 
                                        key={item.id} 
                                        onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }} 
                                        className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl sidebar-item text-left font-medium ${activeTab === item.id ? 'active' : ''}`}
                                    >
                                        <div className="flex items-center gap-3 min-w-0">
                                            <i className={`ph ${item.icon} text-xl shrink-0 ${activeTab === item.id ? 'text-gold-accent' : 'opacity-75'}`}></i>
                                            <span className="text-sm truncate">{item.label}</span>
                                        </div>
                                        {isProgrammer && (
                                            <span className={`text-[9px] px-1.5 py-0.5 rounded uppercase font-bold shrink-0 ${isBlockedForOthers ? 'bg-red-500/20 text-red-400' : 'bg-green-500/15 text-green-400'}`}>
                                                {isBlockedForOthers ? 'Bloq.' : 'Lib.'}
                                            </span>
                                        )}
                                    </button>
                                );
                            })}
                        </nav>
                        
                        <div className="p-4 mt-auto border-t border-[#1A233A] bg-[#050B14] space-y-2">
                            <button 
                                onClick={handleInstallClick} 
                                className="flex items-center justify-center gap-2 bg-primary-blue/15 hover:bg-primary-blue/25 text-primary-blue border border-primary-blue/30 w-full py-2.5 rounded-xl text-xs font-bold transition-colors"
                            >
                                <i className="ph ph-download-simple text-base"></i> Instalar Sistema (App)
                            </button>
                            <button 
                                onClick={async () => {
                                    await recordHistory(currentUserInfo, "Saiu do Sistema", "Logout realizado");
                                    window.fb.signOut(window.firebaseAuth);
                                }} 
                                className="flex items-center justify-center gap-2 bg-[#1A233A]/40 hover:bg-red-500/15 text-text-muted hover:text-red-400 w-full py-2.5 rounded-xl text-xs font-medium transition-colors"
                            >
                                <i className="ph ph-sign-out text-base"></i> Encerrar Sessão
                            </button>
                        </div>
                    </aside>

                    {/* Área Principal */}
                    <main className="flex-1 flex flex-col min-w-0 relative overflow-hidden bg-gradient-to-br from-[#050B14] to-[#0A1222]">
                        {/* Topbar */}

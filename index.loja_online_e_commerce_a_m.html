                            <div className="lg:col-span-1"><InputField label="Estoque" type="number" value={form.stock} onChange={e=>setForm({...form, stock: e.target.value})} placeholder="0" required/></div>
                            <div className="lg:col-span-2 flex gap-2">
                                <label className="p-3 rounded-lg bg-[#050B14] border border-panel-border hover:border-primary-blue text-text-light cursor-pointer flex items-center justify-center shrink-0" title="Enviar Foto do Produto (R2)">
                                    <i className={`ph ${uploadingImg ? 'ph-spinner animate-spin' : form.imageUrl ? 'ph-check-circle text-green-400' : 'ph-camera'} text-xl`}></i>
                                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} disabled={uploadingImg}/>
                                </label>
                                <ButtonPrimary type="submit" className="flex-1 py-3" disabled={isSaving || uploadingImg} icon="ph-check">
                                    {form.id ? 'Atualizar' : 'Salvar'}
                                </ButtonPrimary>
                            </div>
                        </form>
                    </div>

                    <div className="glass-panel p-0 overflow-hidden">
                        <div className="p-5 border-b border-[#1A233A] flex justify-between items-center">
                            <h3 className="text-base font-semibold text-white">Catálogo Cadastrado</h3>
                            <span className="text-xs bg-[#1A233A] text-text-light px-3 py-1 rounded-full">{products.length} produtos</span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-[#050B14]">
                                    <tr>
                                        <th className="px-6 py-4">Produto</th>
                                        <th className="px-6 py-4">Código de Barras</th>
                                        <th className="px-6 py-4 text-right">Custo</th>
                                        <th className="px-6 py-4 text-right">Preço Venda</th>
                                        <th className="px-6 py-4 text-center">Estoque</th>
                                        <th className="px-6 py-4 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {products.length === 0 ? (
                                        <tr><td colSpan="6" className="text-center py-10 text-text-muted">Nenhum produto cadastrado.</td></tr>
                                    ) : (
                                        products.map(p => (
                                            <tr key={p.id} className="border-b border-[#1A233A]/50 hover:bg-white/5">
                                                <td className="px-6 py-3.5">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-lg bg-[#050B14] border border-[#1A233A] flex items-center justify-center overflow-hidden shrink-0">
                                                            {p.imageUrl ? <img src={p.imageUrl} className="w-full h-full object-cover"/> : <i className="ph ph-package text-text-muted"></i>}
                                                        </div>
                                                        <div>
                                                            <div className="text-white font-medium">{p.name}</div>
                                                            <div className="text-[11px] text-text-muted">{p.category || 'Geral'}</div>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="px-6 py-3.5 font-mono text-xs text-text-light">{p.barcode || '---'}</td>
                                                <td className="px-6 py-3.5 text-right text-text-muted">{formatMoney(p.cost)}</td>
                                                <td className="px-6 py-3.5 text-right font-bold text-gold-accent">{formatMoney(p.price)}</td>
                                                <td className="px-6 py-3.5 text-center">
                                                    <span className={`px-2.5 py-1 rounded text-xs font-bold ${p.stock <= 5 ? 'bg-red-500/20 text-red-400' : 'bg-[#1A233A] text-white'}`}>{p.stock} un.</span>
                                                </td>
                                                <td className="px-6 py-3.5 text-right">
                                                    <div className="flex justify-end gap-2">
                                                        <button onClick={() => setForm({ id: p.id, name: p.name, barcode: p.barcode || '', price: p.price, cost: p.cost || 0, stock: p.stock, category: p.category || '', brand: p.brand || '', imageUrl: p.imageUrl || '' })} className="p-2 rounded-lg bg-[#050B14] border border-[#1A233A] text-text-muted hover:text-white" title="Editar">
                                                            <i className="ph ph-pencil-simple"></i>
                                                        </button>
                                                        <button onClick={() => setDeleteTarget(p)} className="p-2 rounded-lg bg-[#050B14] border border-[#1A233A] text-red-400 hover:bg-red-500/10" title="Excluir">
                                                            <i className="ph ph-trash"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal open={!!deleteTarget} onClose={() => setDeleteTarget(null)} title="Excluir Produto?" subtitle="Esta ação removerá o item do catálogo de vendas.">
                        <p className="text-sm text-text-light mb-6">Confirma a exclusão do produto <strong className="text-white">{deleteTarget?.name}</strong>?</p>
                        <div className="flex justify-end gap-3">
                            <ButtonOutline onClick={() => setDeleteTarget(null)}>Cancelar</ButtonOutline>
                            <ButtonPrimary className="bg-red-600 hover:bg-red-700" onClick={confirmDeleteProduct} icon="ph-trash">Excluir Produto</ButtonPrimary>
                        </div>
                    </Modal>

                    <Modal open={confirmWipeProducts} onClose={() => setConfirmWipeProducts(false)} title="Limpar Todos os Produtos?" subtitle="Deixará o sistema sem nenhum produto cadastrado.">
                        <p className="text-sm text-text-light mb-6">
                            Tem certeza que deseja excluir todos os <strong className="text-white">{products.length} produtos</strong> do catálogo?
                        </p>
                        <div className="flex justify-end gap-3">
                            <ButtonOutline onClick={() => setConfirmWipeProducts(false)} disabled={wiping}>Cancelar</ButtonOutline>
                            <ButtonPrimary className="bg-red-600 hover:bg-red-700" onClick={handleWipeAllProducts} disabled={wiping} icon="ph-trash">
                                {wiping ? 'Excluindo Tudo...' : 'Sim, Deixar Sem Produtos'}
                            </ButtonPrimary>
                        </div>
                    </Modal>
                </div>
            );
        };

        // =====================================================================
        // 5. GERADOR DE ETIQUETAS (COM DIMENSÕES E PDF PARA IMPRESSÃO)
        // =====================================================================
        const LabelGenerator = ({ products = [], settings = {}, currentUser }) => {
            const toast = useToast();
            const printAreaRef = useRef(null);

            const presets = [
                { id: '60x40', name: 'Padrão Gôndola / Térmica (60 x 40 mm)', width: 60, height: 40, cols: 1 },
                { id: '50x30', name: 'Adesiva Média (50 x 30 mm)', width: 50, height: 30, cols: 2 },
                { id: '40x25', name: 'Pequena / Varejo (40 x 25 mm)', width: 40, height: 25, cols: 3 },
                { id: '80x50', name: 'Grande / Caixa (80 x 50 mm)', width: 80, height: 50, cols: 1 },
                { id: 'custom', name: 'Dimensão Personalizada (mm)', width: 60, height: 40, cols: 2 }
            ];

            const [presetId, setPresetId] = useState('60x40');
            const [widthMm, setWidthMm] = useState(60);
            const [heightMm, setHeightMm] = useState(40);
            const [columns, setColumns] = useState(2);
            const [gapMm, setGapMm] = useState(3);
            const [fontSizeScale, setFontSizeScale] = useState(100);
            const [borderStyle, setBorderStyle] = useState('dashed');

            const [showCompany, setShowCompany] = useState(true);
            const [showName, setShowName] = useState(true);
            const [showPrice, setShowPrice] = useState(true);
            const [showBarcode, setShowBarcode] = useState(true);
            const [customFooter, setCustomFooter] = useState('');

            const [labelQueue, setLabelQueue] = useState([]);
            const [selectedProductId, setSelectedProductId] = useState('');
            const [qtyToAdd, setQtyToAdd] = useState(1);
            const [manualItem, setManualItem] = useState({ name: '', price: '', barcode: '' });

            const handlePresetChange = (id) => {
                setPresetId(id);
                const found = presets.find(p => p.id === id);
                if (found && id !== 'custom') {
                    setWidthMm(found.width);
                    setHeightMm(found.height);
                    setColumns(found.cols);
                }
            };

            const addProductToQueue = () => {
                const prod = products.find(p => p.id === selectedProductId);
                if (!prod) {
                    toast.error("Selecione um produto da lista.");
                    return;
                }
                const code = prod.barcode || String(prod.id).slice(0, 10).toUpperCase();
                setLabelQueue(prev => [
                    ...prev,
                    {
                        uid: generateId(),
                        name: prod.name,
                        price: prod.price,
                        barcode: code,
                        copies: Math.max(1, parseInt(qtyToAdd) || 1)
                    }
                ]);
                toast.success(`Etiqueta de "${prod.name}" adicionada!`);
            };

            const addManualLabel = (e) => {
                e.preventDefault();
                if (!manualItem.name.trim()) return;
                setLabelQueue(prev => [
                    ...prev,
                    {
                        uid: generateId(),
                        name: manualItem.name.trim(),
                        price: parseFloat(manualItem.price || 0),
                        barcode: manualItem.barcode.trim() || String(Math.floor(10000000 + Math.random() * 90000000)),
                        copies: 1
                    }
                ]);
                setManualItem({ name: '', price: '', barcode: '' });
                toast.success("Etiqueta personalizada adicionada!");
            };

            const updateQueueItem = (uid, field, val) => {
                setLabelQueue(prev => prev.map(item => item.uid === uid ? { ...item, [field]: val } : item));
            };

            const expandedLabels = useMemo(() => {
                const list = [];
                labelQueue.forEach(item => {
                    const count = Math.min(200, Math.max(1, parseInt(item.copies) || 1));
                    for (let i = 0; i < count; i++) {
                        list.push({ ...item, instanceKey: `${item.uid}_${i}` });
                    }
                });
                return list;
            }, [labelQueue]);

            const handleExportLabelsPDF = async () => {
                if (expandedLabels.length === 0 || !printAreaRef.current) {
                    toast.error("Adicione pelo menos uma etiqueta antes de gerar o PDF.");
                    return;
                }
                const pageWidth = (widthMm * columns) + (gapMm * (columns + 1));
                const rowsCount = Math.ceil(expandedLabels.length / columns);
                const pageHeight = Math.max(heightMm + (gapMm * 2), (rowsCount * heightMm) + (gapMm * (rowsCount + 1)));

                const opt = {
                    margin: 0,
                    filename: `etiquetas_${widthMm}x${heightMm}mm_${Date.now()}.pdf`,
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: { scale: 3, useCORS: true, backgroundColor: '#FFFFFF' },
                    jsPDF: { unit: 'mm', format: [pageWidth, pageHeight], orientation: pageWidth > pageHeight ? 'landscape' : 'portrait' }
                };

                toast.info("Gerando PDF nas dimensões exatas para impressão...");
                await window.html2pdf().set(opt).from(printAreaRef.current).save();
                await recordHistory(currentUser, "Gerou PDF de Etiquetas", `${expandedLabels.length} etiquetas (${widthMm}x${heightMm}mm)`);
                toast.success("PDF de etiquetas baixado e pronto para impressão!");
            };

            const handleDirectPrint = () => {
                if (expandedLabels.length === 0 || !printAreaRef.current) {
                    toast.error("Adicione etiquetas à fila primeiro.");
                    return;
                }
                const pageWidth = (widthMm * columns) + (gapMm * (columns + 1));
                const printWin = window.open('', '_blank', 'width=800,height=600');
                if (!printWin) {
                    toast.error("Permita pop-ups para abrir a janela de impressão direta.");
                    return;
                }
                printWin.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Impressão de Etiquetas ${widthMm}x${heightMm}mm</title>
                        <style>
                            @page { size: ${pageWidth}mm auto; margin: 0mm; }
                            body { margin: 0; padding: 0; background: #fff; font-family: 'Inter', Arial, sans-serif; -webkit-print-color-adjust: exact; }
                        </style>
                    </head>
                    <body>
                        ${printAreaRef.current.outerHTML}
                        <script>
                            window.onload = function() { setTimeout(function() { window.print(); window.close(); }, 350); };
                        <\/script>
                    </body>
                    </html>
                `);
                printWin.document.close();
                recordHistory(currentUser, "Imprimiu Etiquetas", `${expandedLabels.length} etiquetas (${widthMm}x${heightMm}mm)`);
            };

            return (
                <div className="fade-in pb-10">
                    <PageHeader 
                        title="Gerador de Etiquetas" 
                        subtitle="Personalize dimensões, código de barras e exporte em PDF calibrado para impressão."
                        action={
                            <>
                                <ButtonOutline icon="ph-printer" onClick={handleDirectPrint} disabled={!expandedLabels.length}>Imprimir Direto</ButtonOutline>
                                <ButtonPrimary icon="ph-file-pdf" onClick={handleExportLabelsPDF} disabled={!expandedLabels.length}>Baixar PDF p/ Impressão</ButtonPrimary>
                            </>
                        }
                    />

                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
                        <div className="xl:col-span-5 space-y-6">
                            <div className="glass-panel p-6">
                                <h3 className="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                                    <i className="ph ph-plus-circle text-primary-blue"></i> 1. Selecionar Produtos para Etiqueta
                                </h3>
                                <div className="space-y-4">
                                    <div className="flex flex-col sm:flex-row gap-3 items-end">
                                        <div className="flex-1 w-full">
                                            <label className="text-xs font-medium text-text-muted uppercase tracking-wider block mb-1.5">Produto do Catálogo</label>
                                            <select value={selectedProductId} onChange={e => setSelectedProductId(e.target.value)} className="input-dark rounded-lg p-3 w-full text-sm">
                                                <option value="">Selecione um produto...</option>
                                                {products.map(p => (
                                                    <option key={p.id} value={p.id}>{p.name} — {formatMoney(p.price)} ({p.barcode || 'S/ cód'})</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="w-full sm:w-24">
                                            <InputField label="Qtd." type="number" min="1" max="100" value={qtyToAdd} onChange={e => setQtyToAdd(e.target.value)} />
                                        </div>
                                        <ButtonPrimary onClick={addProductToQueue} className="w-full sm:w-auto py-3" icon="ph-plus">Incluir</ButtonPrimary>
                                    </div>

                                    <div className="pt-4 border-t border-panel-border">
                                        <p className="text-xs text-text-muted uppercase font-semibold mb-3">Ou criar etiqueta avulsa / personalizada:</p>
                                        <form onSubmit={addManualLabel} className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                            <input type="text" placeholder="Nome / Título" value={manualItem.name} onChange={e => setManualItem({...manualItem, name: e.target.value})} className="input-dark rounded-lg p-2.5 text-xs" required />
                                            <input type="number" step="0.01" placeholder="Preço (R$)" value={manualItem.price} onChange={e => setManualItem({...manualItem, price: e.target.value})} className="input-dark rounded-lg p-2.5 text-xs" />
                                            <div className="flex gap-2">
                                                <input type="text" placeholder="Código" value={manualItem.barcode} onChange={e => setManualItem({...manualItem, barcode: e.target.value})} className="input-dark rounded-lg p-2.5 text-xs w-full" />
                                                <ButtonOutline type="submit" size="sm" icon="ph-plus">Criar</ButtonOutline>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>

                            <div className="glass-panel p-6">
                                <h3 className="text-sm font-bold text-white uppercase tracking-wider mb-4 flex items-center gap-2">
                                    <i className="ph ph-rulers text-gold-accent"></i> 2. Dimensões e Layout (mm)
                                </h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-medium text-text-muted uppercase tracking-wider block mb-1.5">Formato / Modelo de Etiqueta</label>
                                        <select value={presetId} onChange={e => handlePresetChange(e.target.value)} className="input-dark rounded-lg p-3 w-full text-sm">
                                            {presets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                        </select>
                                    </div>

                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                        <InputField label="Largura (mm)" type="number" min="20" max="200" value={widthMm} onChange={e => { setPresetId('custom'); setWidthMm(Number(e.target.value) || 60); }} />
                                        <InputField label="Altura (mm)" type="number" min="15" max="200" value={heightMm} onChange={e => { setPresetId('custom'); setHeightMm(Number(e.target.value) || 40); }} />
                                        <InputField label="Colunas" type="number" min="1" max="5" value={columns} onChange={e => setColumns(Math.max(1, Math.min(5, Number(e.target.value) || 1)))} />
                                        <InputField label="Espaço (mm)" type="number" min="0" max="20" value={gapMm} onChange={e => setGapMm(Math.max(0, Number(e.target.value) || 0))} />
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                        <div>
                                            <label className="text-xs font-medium text-text-muted uppercase tracking-wider block mb-1.5">Escala da Fonte ({fontSizeScale}%)</label>
                                            <input type="range" min="70" max="140" value={fontSizeScale} onChange={e => setFontSizeScale(Number(e.target.value))} className="w-full accent-primary-blue mt-2" />
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-text-muted uppercase tracking-wider block mb-1.5">Borda de Corte</label>
                                            <select value={borderStyle} onChange={e => setBorderStyle(e.target.value)} className="input-dark rounded-lg p-2.5 w-full text-xs">
                                                <option value="dashed">Tracejada (Guia de Corte)</option>
                                                <option value="solid">Linha Sólida</option>
                                                <option value="none">Sem Borda (Rolo Térmico)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2.5 pt-2 text-xs">
                                        <label className="flex items-center gap-2 cursor-pointer text-text-light">
                                            <input type="checkbox" checked={showCompany} onChange={e => setShowCompany(e.target.checked)} className="accent-primary-blue" /> Nome da Empresa
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-text-light">
                                            <input type="checkbox" checked={showName} onChange={e => setShowName(e.target.checked)} className="accent-primary-blue" /> Nome do Produto
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-text-light">
                                            <input type="checkbox" checked={showPrice} onChange={e => setShowPrice(e.target.checked)} className="accent-primary-blue" /> Preço em Destaque
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer text-text-light">
                                            <input type="checkbox" checked={showBarcode} onChange={e => setShowBarcode(e.target.checked)} className="accent-primary-blue" /> Código de Barras
                                        </label>
                                    </div>

                                    <InputField label="Texto Extra / Rodapé (Opcional)" value={customFooter} onChange={e => setCustomFooter(e.target.value)} placeholder="Ex: Troca em até 7 dias / Promoção" />
                                </div>
                            </div>

                            {labelQueue.length > 0 && (
                                <div className="glass-panel p-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-sm font-bold text-white uppercase tracking-wider">Itens na Fila ({expandedLabels.length} etiquetas)</h3>
                                        <button onClick={() => setLabelQueue([])} className="text-xs text-red-400 hover:underline">Limpar Tudo</button>
                                    </div>
                                    <div className="space-y-3 max-h-64 overflow-y-auto custom-scrollbar pr-1">
                                        {labelQueue.map(item => (
                                            <div key={item.uid} className="bg-[#050B14] border border-panel-border rounded-lg p-3 flex flex-col gap-2">
                                                <div className="flex justify-between items-center gap-2">
                                                    <input 
                                                        type="text" 
                                                        value={item.name} 
                                                        onChange={e => updateQueueItem(item.uid, 'name', e.target.value)}
                                                        className="bg-transparent text-white font-semibold text-xs border-b border-transparent focus:border-primary-blue focus:outline-none flex-1"
                                                    />
                                                    <button onClick={() => setLabelQueue(q => q.filter(x => x.uid !== item.uid))} className="text-red-400 hover:text-red-300"><i className="ph ph-trash"></i></button>
                                                </div>
                                                <div className="grid grid-cols-3 gap-2">
                                                    <div>
                                                        <span className="text-[10px] text-text-muted block">Preço (R$)</span>
                                                        <input type="number" step="0.01" value={item.price} onChange={e => updateQueueItem(item.uid, 'price', parseFloat(e.target.value)||0)} className="input-dark rounded px-2 py-1 text-xs w-full" />
                                                    </div>
                                                    <div>
                                                        <span className="text-[10px] text-text-muted block">Código</span>
                                                        <input type="text" value={item.barcode} onChange={e => updateQueueItem(item.uid, 'barcode', e.target.value)} className="input-dark rounded px-2 py-1 text-xs w-full" />
                                                    </div>
                                                    <div>
                                                        <span className="text-[10px] text-text-muted block">Cópias</span>
                                                        <input type="number" min="1" max="100" value={item.copies} onChange={e => updateQueueItem(item.uid, 'copies', parseInt(e.target.value)||1)} className="input-dark rounded px-2 py-1 text-xs w-full" />
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="xl:col-span-7 glass-panel p-6 flex flex-col">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-panel-border pb-4 mb-6">
                                <div>
                                    <h3 className="text-base font-bold text-white">Pré-visualização de Impressão</h3>
                                    <p className="text-xs text-text-muted">Tamanho Individual: {widthMm}mm x {heightMm}mm • {columns} coluna(s)</p>
                                </div>
                                <span className="text-xs bg-gold-accent/15 text-gold-accent px-3 py-1 rounded-full font-semibold">
                                    Pronto para Impressora Térmica ou A4
                                </span>
                            </div>

                            {expandedLabels.length === 0 ? (
                                <div className="py-20 flex flex-col items-center justify-center opacity-40 text-center">
                                    <i className="ph ph-barcode text-6xl mb-3"></i>
                                    <p className="text-base font-medium text-white">Nenhuma etiqueta na fila</p>
                                    <p className="text-xs max-w-sm mt-1">Selecione produtos ao lado ou crie uma etiqueta manual para visualizar e gerar o PDF de impressão.</p>
                                </div>
                            ) : (
                                <div className="overflow-auto bg-[#050B14] p-6 rounded-xl border border-panel-border flex justify-center">
                                    <div 
                                        ref={printAreaRef}
                                        style={{
                                            backgroundColor: '#FFFFFF',
                                            color: '#000000',
                                            padding: `${gapMm}mm`,
                                            display: 'grid',
                                            gridTemplateColumns: `repeat(${columns}, ${widthMm}mm)`,
                                            gap: `${gapMm}mm`,
                                            width: 'fit-content'
                                        }}
                                    >
                                        {expandedLabels.map((lbl) => (
                                            <div 
                                                key={lbl.instanceKey}
                                                style={{
                                                    width: `${widthMm}mm`,
                                                    height: `${heightMm}mm`,
                                                    border: borderStyle === 'none' ? 'none' : `1px ${borderStyle} #999999`,
                                                    boxSizing: 'border-box',
                                                    padding: '2mm',
                                                    display: 'flex',
                                                    flexDirection: 'column',
                                                    justifyContent: 'space-between',
                                                    alignItems: 'center',
                                                    textAlign: 'center',
                                                    overflow: 'hidden',
                                                    backgroundColor: '#FFFFFF',
                                                    color: '#000000',
                                                    fontSize: `${fontSizeScale}%`
                                                }}
                                            >
                                                {showCompany && (
                                                    <div style={{ fontSize: '0.55em', fontWeight: 700, letterSpacing: '0.06em', textTransform: 'uppercase', width: '100%', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                                        {settings?.name || 'CAIXA SISTEM A&M'}
                                                    </div>
                                                )}
                                                {showName && (
                                                    <div style={{ fontSize: '0.75em', fontWeight: 700, lineHeight: 1.15, maxHeight: '2.3em', overflow: 'hidden', width: '100%' }}>
                                                        {lbl.name}
                                                    </div>
                                                )}
                                                {showPrice && (
                                                    <div style={{ fontSize: '1.15em', fontWeight: 800, color: '#000000', lineHeight: 1 }}>
                                                        {formatMoney(lbl.price)}
                                                    </div>
                                                )}
                                                {showBarcode && (
                                                    <div style={{ width: '100%', display: 'flex', justifyContent: 'center', overflow: 'hidden' }}>
                                                        <BarcodeSVG 
                                                            value={lbl.barcode} 
                                                            width={widthMm < 45 ? 1.1 : 1.4} 
                                                            height={heightMm < 30 ? 18 : 26} 
                                                            displayValue={true} 
                                                        />
                                                    </div>
                                                )}
                                                {customFooter && (
                                                    <div style={{ fontSize: '0.5em', color: '#333333', width: '100%', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                                        {customFooter}
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // =====================================================================
        // 6. DESEMPENHO FINANCEIRO (COM EXPORTAÇÃO PDF E LIMPEZA DE VENDAS/DESPESAS)
        // =====================================================================
        const FinancialPerformance = ({ sales = [], expenses = [], settings = {}, currentUser }) => {
            const toast = useToast();
            const reportRef = useRef(null);
            const [expenseForm, setExpenseForm] = useState({ description: '', value: '' });
            const [confirmWipeModal, setConfirmWipeModal] = useState(null); // 'sales' | 'expenses'
            const [wiping, setWiping] = useState(false);

            const totalRevenue = sales.reduce((a,b)=>a+(Number(b.total)||0),0);
            const totalCost = sales.reduce((acc, sale) => acc + (sale.items||[]).reduce((iAcc, item) => iAcc + ((Number(item.cost)||0) * (Number(item.qty)||0)), 0), 0);
            const totalExpenses = expenses.reduce((a,b)=>a+(Number(b.value)||0),0);
            const grossProfit = totalRevenue - totalCost;
            const netProfit = grossProfit - totalExpenses;
            const margin = totalRevenue > 0 ? (netProfit / totalRevenue) * 100 : 0;

            const handleAddExpense = async (e) => {
                e.preventDefault();
                if (!expenseForm.description.trim() || !expenseForm.value) return;
                try {
                    await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'expenses'), {
                        description: expenseForm.description.trim(),
                        value: parseFloat(expenseForm.value),
                        date: new Date().toISOString(),
                        operator: currentUser.email
                    });
                    await recordHistory(currentUser, "Registrou Despesa Financeira", `${expenseForm.description}: ${formatMoney(expenseForm.value)}`);
                    toast.success("Despesa registrada!");
                    setExpenseForm({ description: '', value: '' });
                } catch (e) {
                    toast.error("Erro ao salvar despesa.");
                }
            };

            const handleWipeFinancial = async () => {
                if (!confirmWipeModal) return;
                setWiping(true);
                try {
                    if (confirmWipeModal === 'sales') {
                        const count = await wipeCollectionDocs('sales');
                        toast.success(`${count} venda(s) apagada(s)!`);
                    } else if (confirmWipeModal === 'expenses') {
                        const count = await wipeCollectionDocs('expenses');
                        toast.success(`${count} despesa(s) apagada(s)!`);
                    }
                    setConfirmWipeModal(null);
                } catch (e) {
                    toast.error("Erro ao limpar dados financeiros.");
                }
                setWiping(false);
            };

            const exportFinancialPDF = async () => {
                if (!reportRef.current) return;
                toast.info("Gerando relatório financeiro em PDF...");
                await window.html2pdf().set({
                    margin: 10,
                    filename: `relatorio_financeiro_${new Date().toISOString().split('T')[0]}.pdf`,
                    html2canvas: { scale: 2, backgroundColor: '#050B14' },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(reportRef.current).save();
                await recordHistory(currentUser, "Exportou Relatório Financeiro PDF", `Receita: ${formatMoney(totalRevenue)}`);
                toast.success("PDF Financeiro exportado com sucesso!");
            };

            const chartData = useMemo(() => {
                const map = new Map();
                sales.forEach(s => {
                    const d = (s.date || '').slice(0, 10) || 'Hoje';
                    const cur = map.get(d) || { name: d.slice(8,10)+'/'+d.slice(5,7), receita: 0, lucro: 0 };
                    const rev = Number(s.total) || 0;
                    const cst = (s.items||[]).reduce((a,i)=>a+((Number(i.cost)||0)*(Number(i.qty)||0)),0);
                    cur.receita += rev;
                    cur.lucro += (rev - cst);
                    map.set(d, cur);
                });
                const arr = Array.from(map.values());
                return arr.length ? arr : [{ name: 'Hoje', receita: 0, lucro: 0 }];
            }, [sales]);

            return (
                <div className="fade-in pb-10">
                    <PageHeader 
                        title="Desempenho Financeiro" 
                        subtitle="Gráfico de rendimentos, entradas, saídas, lucros e exportação em PDF."
                        action={
                            <>
                                {currentUser?.isProgrammer && sales.length > 0 && (
                                    <ButtonOutline icon="ph-trash" className="border-red-500/40 text-red-400 hover:bg-red-500/10" onClick={() => setConfirmWipeModal('sales')}>
                                        Limpar Vendas
                                    </ButtonOutline>
                                )}
                                {currentUser?.isProgrammer && expenses.length > 0 && (
                                    <ButtonOutline icon="ph-trash" className="border-red-500/40 text-red-400 hover:bg-red-500/10" onClick={() => setConfirmWipeModal('expenses')}>
                                        Limpar Despesas
                                    </ButtonOutline>
                                )}
                                <ButtonPrimary icon="ph-file-pdf" onClick={exportFinancialPDF}>Exportar Relatório PDF</ButtonPrimary>
                            </>
                        }
                    />
                    
                    <div ref={reportRef} className="space-y-6">
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                            <div className="glass-panel p-5 border-l-4 border-l-primary-blue">
                                <p className="text-xs text-text-muted uppercase font-semibold">Receita Bruta de Vendas</p>
                                <h3 className="text-2xl font-bold text-white mt-1">{formatMoney(totalRevenue)}</h3>
                            </div>
                            <div className="glass-panel p-5 border-l-4 border-l-gold-accent">
                                <p className="text-xs text-text-muted uppercase font-semibold">Lucro Bruto</p>
                                <h3 className="text-2xl font-bold text-gold-accent mt-1">{formatMoney(grossProfit)}</h3>
                            </div>
                            <div className="glass-panel p-5 border-l-4 border-l-red-500">
                                <p className="text-xs text-text-muted uppercase font-semibold">Saídas / Despesas</p>
                                <h3 className="text-2xl font-bold text-red-400 mt-1">{formatMoney(totalExpenses)}</h3>
                            </div>
                            <div className="glass-panel p-5 border-l-4 border-l-green-500">
                                <p className="text-xs text-text-muted uppercase font-semibold">Resultado Líquido ({margin.toFixed(1)}%)</p>
                                <h3 className="text-2xl font-bold text-green-400 mt-1">{formatMoney(netProfit)}</h3>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 xl:grid-cols-12 gap-6">
                            <div className="xl:col-span-8 glass-panel p-6 flex flex-col h-[380px]">
                                <h3 className="text-base font-bold text-white mb-4">Evolução de Trade Financeiro (Receita vs Lucro)</h3>
                                <div className="flex-1 min-h-0">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={chartData}>
                                            <defs>
                                                <linearGradient id="colorReceita" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#0062FF" stopOpacity={0.35}/>
                                                    <stop offset="95%" stopColor="#0062FF" stopOpacity={0}/>
                                                </linearGradient>
                                                <linearGradient id="colorLucro" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#F5A524" stopOpacity={0.35}/>
                                                    <stop offset="95%" stopColor="#F5A524" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <XAxis dataKey="name" stroke="#64748B" fontSize={12} />
                                            <YAxis stroke="#64748B" fontSize={12} />
                                            <CartesianGrid strokeDasharray="3 3" stroke="#1A233A" />
                                            <RechartsTooltip contentStyle={{backgroundColor: '#0A1222', borderColor: '#1A233A', borderRadius: '8px'}} formatter={(value) => formatMoney(value)} />
                                            <Area type="monotone" dataKey="receita" name="Receita" stroke="#0062FF" strokeWidth={3} fill="url(#colorReceita)" />
                                            <Area type="monotone" dataKey="lucro" name="Lucro" stroke="#F5A524" strokeWidth={3} fill="url(#colorLucro)" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="xl:col-span-4 glass-panel p-6 flex flex-col">
                                <h3 className="text-base font-bold text-white mb-4">Registrar Despesa / Saída</h3>
                                <form onSubmit={handleAddExpense} className="space-y-3 mb-6">
                                    <InputField label="Descrição da Saída" value={expenseForm.description} onChange={e=>setExpenseForm({...expenseForm, description: e.target.value})} placeholder="Ex: Conta de Energia / Fornecedor" required />
                                    <InputField label="Valor (R$)" type="number" step="0.01" min="0.01" value={expenseForm.value} onChange={e=>setExpenseForm({...expenseForm, value: e.target.value})} placeholder="0.00" required />
                                    <ButtonPrimary type="submit" className="w-full" icon="ph-plus">Adicionar Despesa</ButtonPrimary>
                                </form>
                                <div className="flex-1 overflow-y-auto custom-scrollbar max-h-40 space-y-2">
                                    {expenses.map(ex => (
                                        <div key={ex.id} className="flex justify-between items-center text-xs bg-[#050B14] p-2.5 rounded border border-panel-border">
                                            <span className="text-text-light truncate">{ex.description}</span>
                                            <span className="text-red-400 font-bold shrink-0">- {formatMoney(ex.value)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <Modal open={!!confirmWipeModal} onClose={() => setConfirmWipeModal(null)} title="Confirmar Limpeza Financeira" subtitle="Ação exclusiva do Programador Geral.">
                        <p className="text-sm text-text-light mb-6">
                            {confirmWipeModal === 'sales' ? "Deseja apagar todo o histórico de vendas registradas?" : "Deseja apagar todas as despesas registradas?"}
                        </p>
                        <div className="flex justify-end gap-3">
                            <ButtonOutline onClick={() => setConfirmWipeModal(null)} disabled={wiping}>Cancelar</ButtonOutline>
                            <ButtonPrimary className="bg-red-600 hover:bg-red-700" onClick={handleWipeFinancial} disabled={wiping} icon="ph-trash">
                                {wiping ? 'Apagando...' : 'Confirmar Exclusão'}
                            </ButtonPrimary>
                        </div>
                    </Modal>
                </div>
            );
        };

        // =====================================================================
        // 7. CONTROLE DE ACESSOS + PAINEL DO PROGRAMADOR GERAL (ABAS E LIMPEZA DE DADOS)
        // =====================================================================
        const AccessControl = ({ users = [], history = [], products = [], sales = [], sessions = [], cashMovements = [], expenses = [], settings = {}, currentUser }) => {
            const toast = useToast();
            const [subTab, setSubTab] = useState(currentUser.isProgrammer ? 'programador' : 'colab'); // 'colab' | 'admin' | 'historico' | 'programador'
            const [modalOpen, setModalOpen] = useState(false);
            const [saving, setSaving] = useState(false);
            const [deleteUserModal, setDeleteUserModal] = useState(null);
            const [historyFilter, setHistoryFilter] = useState('');

            // Estado para Limpeza de Dados do Sistema pelo Programador Geral
            const [wipeTarget, setWipeTarget] = useState(null); // { key, title, desc }
            const [isWipingData, setIsWipingData] = useState(false);

            const selectableTabs = ALL_NAV_TABS.filter(t => !['acessos', 'configuracoes', 'app_monitor', 'ecommerce'].includes(t.id));

            const [form, setForm] = useState({
                id: '',
                name: '',
                email: '',
                password: '',
                role: 'colab',
                permissions: ['dashboard', 'caixa', 'turnos', 'etiquetas', 'suporte']
            });

            // O login and03jhe@gmail.com NUNCA aparece na lista de usuários!
            const visibleUsers = useMemo(() => {
                return users.filter(u => 
                    u.email?.toLowerCase() !== MASTER_EMAIL && 
                    u.role !== 'programador' && 
                    !u.isProgrammer
                );
            }, [users]);

            const colabList = visibleUsers.filter(u => u.role === 'colab');
            const adminList = visibleUsers.filter(u => u.role === 'admin');

            const togglePermission = (tabId) => {
                setForm(prev => {
                    const exists = prev.permissions.includes(tabId);
                    return {
                        ...prev,
                        permissions: exists ? prev.permissions.filter(id => id !== tabId) : [...prev.permissions, tabId]
                    };
                });
            };

            const openNewUserModal = (defaultRole = 'colab') => {
                setForm({
                    id: '',
                    name: '',
                    email: '',
                    password: '',
                    role: defaultRole,
                    permissions: ['dashboard', 'caixa', 'turnos', 'produtos', 'etiquetas', 'suporte']
                });
                setModalOpen(true);
            };

            const openEditUserModal = (u) => {
                setForm({
                    id: u.id,
                    name: u.name || '',
                    email: u.email || '',
                    password: '',
                    role: u.role || 'colab',
                    permissions: u.permissions || ['dashboard', 'caixa']
                });
                setModalOpen(true);
            };

            const handleSaveUser = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    if (form.id) {
                        await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'users', form.id), {
                            name: form.name.trim(),
                            role: form.role,
                            permissions: form.role === 'admin' ? ALL_NAV_TABS.map(t => t.id) : form.permissions
                        });
                        await recordHistory(currentUser, "Editou Acesso de Usuário", `${form.name} (${form.role === 'admin' ? 'Administrador' : 'Colaborador'})`);
                        toast.success("Acesso atualizado com sucesso!");
                    } else {
                        if (form.password.length < 6) {
                            toast.error("A senha inicial deve ter no mínimo 6 caracteres.");
                            setSaving(false);
                            return;
                        }
                        const cleanEmail = form.email.trim().toLowerCase();
                        if (cleanEmail === MASTER_EMAIL) {
                            toast.error("Este e-mail é reservado ao sistema.");
                            setSaving(false);
                            return;
                        }
                        const cred = await window.fb.signUp(window.secondaryAuth, cleanEmail, form.password);
                        await window.fb.signOut(window.secondaryAuth);

                        await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'users', cred.user.uid), {
                            name: form.name.trim(),
                            email: cleanEmail,
                            role: form.role,
                            active: true,
                            permissions: form.role === 'admin' ? ALL_NAV_TABS.map(t => t.id) : form.permissions,
                            createdAt: new Date().toISOString()
                        });
                        await recordHistory(currentUser, "Cadastrou Novo Acesso", `${form.name} (${cleanEmail}) como ${form.role === 'admin' ? 'Administrador' : 'Colaborador'}`);
                        toast.success("Novo usuário cadastrado e liberado!");
                    }
                    setModalOpen(false);
                } catch (err) {
                    toast.error("Erro ao salvar acesso: " + (err.message || "Verifique o e-mail informado."));
                }
                setSaving(false);
            };

            const confirmDeleteUser = async () => {
                if (!deleteUserModal) return;
                try {
                    await window.fb.deleteDoc(window.fb.doc(window.firebaseDb, 'users', deleteUserModal.id));
                    await recordHistory(currentUser, "Removeu Acesso de Usuário", `${deleteUserModal.name} (${deleteUserModal.email})`);
                    toast.success("Acesso removido com sucesso.");
                    setDeleteUserModal(null);
                } catch (e) {
                    toast.error("Erro ao remover usuário.");
                }
            };

            // Controle exclusivo do Programador Geral para liberar ou bloquear abas
            const blockedTabs = settings?.blockedTabs || [];
            const toggleGlobalTabBlock = async (tabId) => {
                if (!currentUser.isProgrammer) return;
                const isBlocked = blockedTabs.includes(tabId);
                const updated = isBlocked ? blockedTabs.filter(id => id !== tabId) : [...blockedTabs, tabId];
                try {
                    await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'settings', 'geral'), {
                        ...settings,
                        blockedTabs: updated
                    }, { merge: true });
                    toast.success(isBlocked ? `Aba "${ALL_NAV_TABS.find(t=>t.id===tabId)?.label}" LIBERADA!` : `Aba "${ALL_NAV_TABS.find(t=>t.id===tabId)?.label}" BLOQUEADA!`);
                } catch (e) {
                    toast.error("Erro ao alterar bloqueio de aba.");
                }
            };

            const setAllTabsBlockState = async (blockAll) => {
                if (!currentUser.isProgrammer) return;
                const updated = blockAll ? ALL_NAV_TABS.map(t => t.id) : [];
                try {
                    await window.fb.setDoc(window.fb.doc(window.firebaseDb, 'settings', 'geral'), {
                        ...settings,
                        blockedTabs: updated
                    }, { merge: true });
                    toast.success(blockAll ? "Todas as abas foram bloqueadas para os usuários!" : "Todas as abas foram liberadas no sistema!");
                } catch (e) {
                    toast.error("Erro ao atualizar abas.");
                }
            };

            // Execução da Limpeza de Dados do Sistema pelo Programador Geral
            const handleConfirmWipe = async () => {
                if (!wipeTarget || !currentUser.isProgrammer) return;
                setIsWipingData(true);
                try {
                    if (wipeTarget.key === 'sessions') {
                        const c1 = await wipeCollectionDocs('sessions');
                        toast.success(`${c1} registro(s) de quem abriu o caixa apagados!`);
                    } else if (wipeTarget.key === 'cashMovements') {
                        const c = await wipeCollectionDocs('cashMovements');
                        toast.success(`${c} sangria(s)/reforço(s) apagados!`);
                    } else if (wipeTarget.key === 'products') {
                        const c = await wipeCollectionDocs('products');
                        toast.success(`${c} produto(s) removidos! O sistema agora está sem produtos.`);
                    } else if (wipeTarget.key === 'sales') {
                        const c = await wipeCollectionDocs('sales');
                        toast.success(`${c} venda(s) apagadas do histórico!`);
                    } else if (wipeTarget.key === 'expenses') {
                        const c = await wipeCollectionDocs('expenses');
                        toast.success(`${c} despesa(s) financeiras apagadas!`);
                    } else if (wipeTarget.key === 'history') {
                        const c = await wipeCollectionDocs('history');
                        toast.success(`${c} registro(s) de histórico de atividades limpos!`);
                    } else if (wipeTarget.key === 'all_data') {
                        await Promise.all([
                            wipeCollectionDocs('sessions'),
                            wipeCollectionDocs('cashMovements'),
                            wipeCollectionDocs('products'),
                            wipeCollectionDocs('sales'),
                            wipeCollectionDocs('expenses'),
                            wipeCollectionDocs('history')
                        ]);
                        try { localStorage.removeItem('am_pos_cart_' + currentUser.email); } catch {}
                        toast.success("Limpeza Geral concluída! Todos os caixas, produtos, vendas e históricos foram zerados.");
                    }
                    setWipeTarget(null);
                } catch (e) {
                    toast.error("Erro durante a limpeza de dados: " + e.message);
                }
                setIsWipingData(false);
            };

            const filteredHistory = useMemo(() => {
                return [...history]
                    .filter(h => h.userEmail?.toLowerCase() !== MASTER_EMAIL || currentUser.isProgrammer)
                    .filter(h => (h.userName + ' ' + h.action + ' ' + h.details).toLowerCase().includes(historyFilter.toLowerCase()))
                    .sort((a,b) => new Date(b.at) - new Date(a.at));
            }, [history, historyFilter, currentUser.isProgrammer]);

            return (
                <div className="fade-in pb-10">
                    <PageHeader 
                        title="Controle de Acessos" 
                        subtitle="Cadastre colaboradores, administradores e gerencie permissões e dados da plataforma."
                        action={
                            <div className="flex flex-wrap gap-2">
                                <ButtonOutline icon="ph-user-plus" onClick={() => openNewUserModal('admin')}>Novo Administrador</ButtonOutline>
                                <ButtonPrimary icon="ph-user-plus" onClick={() => openNewUserModal('colab')}>Novo Colaborador</ButtonPrimary>
                            </div>
                        }
                    />
                    
                    <div className="glass-panel p-0 overflow-hidden">
                        {/* Navegação de Sub-abas */}
                        <div className="px-6 pt-4 border-b border-[#1A233A] bg-[#0A1222] flex flex-wrap gap-6">
                            {currentUser.isProgrammer && (
                                <button onClick={() => setSubTab('programador')} className={`pb-3 text-sm font-bold border-b-2 transition-colors flex items-center gap-1.5 ${subTab === 'programador' ? 'border-purple-400 text-purple-400' : 'border-transparent text-text-muted hover:text-white'}`}>
                                    <i className="ph-fill ph-shield-star text-base"></i> Painel do Programador (Abas e Limpeza de Dados)
                                </button>
                            )}
                            <button onClick={() => setSubTab('colab')} className={`pb-3 text-sm font-semibold border-b-2 transition-colors ${subTab === 'colab' ? 'border-primary-blue text-primary-blue' : 'border-transparent text-text-muted hover:text-white'}`}>
                                Colaboradores ({colabList.length})
                            </button>
                            <button onClick={() => setSubTab('admin')} className={`pb-3 text-sm font-semibold border-b-2 transition-colors ${subTab === 'admin' ? 'border-primary-blue text-primary-blue' : 'border-transparent text-text-muted hover:text-white'}`}>
                                Administradores ({adminList.length})
                            </button>
                            <button onClick={() => setSubTab('historico')} className={`pb-3 text-sm font-semibold border-b-2 transition-colors flex items-center gap-1.5 ${subTab === 'historico' ? 'border-gold-accent text-gold-accent' : 'border-transparent text-text-muted hover:text-white'}`}>
                                <i className="ph ph-clock-counter-clockwise"></i> Histórico ({filteredHistory.length})
                            </button>
                        </div>

                        {/* SUB-ABA EXCLUSIVA DO PROGRAMADOR GERAL: LIBERAR/BLOQUEAR ABAS + LIMPAR DADOS DO SISTEMA */}
                        {subTab === 'programador' && currentUser.isProgrammer && (
                            <div className="p-6 space-y-8">
                                <div className="bg-purple-500/10 border border-purple-500/30 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div>
                                        <h4 className="text-sm font-bold text-purple-300 flex items-center gap-2">
                                            <i className="ph-fill ph-shield-star text-lg"></i> Acesso Mestre Oculto Ativo ({MASTER_EMAIL})
                                        </h4>
                                        <p className="text-xs text-text-light mt-1">
                                            Seu usuário nunca aparece nas listas do sistema. Abaixo você tem controle total para <strong>liberar ou bloquear abas</strong> e <strong>limpar quaisquer dados do sistema</strong>.
                                        </p>
                                    </div>
                                    <div className="flex gap-2 shrink-0">
                                        <ButtonOutline size="sm" onClick={() => setAllTabsBlockState(false)} className="border-green-500/40 text-green-400 hover:bg-green-500/10" icon="ph-lock-key-open">
                                            Liberar Todas as Abas
                                        </ButtonOutline>
                                        <ButtonOutline size="sm" onClick={() => setAllTabsBlockState(true)} className="border-red-500/40 text-red-400 hover:bg-red-500/10" icon="ph-lock-key">
                                            Bloquear Todas
                                        </ButtonOutline>
                                    </div>
                                </div>

                                {/* SEÇÃO 1: LIBERAR OU BLOQUEAR ABAS */}
                                <div>
                                    <h3 className="text-base font-bold text-white mb-1 flex items-center gap-2">
                                        <i className="ph ph-squares-four text-gold-accent"></i> 1. Controle de Liberação de Abas da Plataforma
                                    </h3>
                                    <p className="text-xs text-text-muted mb-4">Decida quais abas estão liberadas ou bloqueadas para Administradores e Colaboradores:</p>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {ALL_NAV_TABS.map(tab => {
                                            const isBlocked = blockedTabs.includes(tab.id);
                                            return (
                                                <div key={tab.id} className={`p-4 rounded-xl border transition-all flex items-center justify-between ${isBlocked ? 'bg-red-500/10 border-red-500/40' : 'bg-[#050B14] border-panel-border'}`}>
                                                    <div className="flex items-center gap-3 min-w-0">
                                                        <div className={`w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${isBlocked ? 'bg-red-500/20 text-red-400' : 'bg-green-500/15 text-green-400'}`}>
                                                            <i className={`ph ${tab.icon} text-xl`}></i>
                                                        </div>
                                                        <div className="min-w-0">
                                                            <p className="text-sm font-bold text-white truncate">{tab.label}</p>
                                                            <span className={`inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded mt-0.5 ${isBlocked ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'}`}>
                                                                {isBlocked ? 'Bloqueada' : 'Liberada'}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => toggleGlobalTabBlock(tab.id)}
                                                        className={`px-3.5 py-2 rounded-lg text-xs font-bold transition-colors shrink-0 ${isBlocked ? 'bg-green-600 text-white hover:bg-green-500' : 'bg-red-500/20 text-red-400 border border-red-500/30 hover:bg-red-500/30'}`}
                                                    >
                                                        {isBlocked ? 'Liberar Aba' : 'Bloquear'}
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* SEÇÃO 2: CENTRAL DE LIMPEZA DE DADOS DO SISTEMA */}
                                <div className="pt-6 border-t border-panel-border">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                                        <div>
                                            <h3 className="text-base font-bold text-white flex items-center gap-2">
                                                <i className="ph ph-broom text-red-400"></i> 2. Central de Limpeza de Dados do Sistema
                                            </h3>
                                            <p className="text-xs text-text-muted mt-0.5">
                                                Apague registros de quem abriu o caixa, deixe o sistema sem produtos, zere o histórico de vendas ou faça uma limpeza geral.
                                            </p>
                                        </div>
                                        <button 
                                            onClick={() => setWipeTarget({
                                                key: 'all_data',
                                                title: 'Reset Geral de Dados do Sistema',
                                                desc: 'Isso apagará TODOS os turnos (quem abriu caixa), sangrias/reforços, TODOS os produtos cadastrados, TODO o histórico de vendas, despesas e histórico de atividades de uma só vez!'
                                            })}
                                            className="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold flex items-center gap-2 shadow-lg shadow-red-600/20 shrink-0"
                                        >
                                            <i className="ph ph-warning-octagon text-base"></i> Limpar Todos os Dados do Sistema
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {[
                                            {
                                                key: 'sessions',
                                                title: 'Quem Abriu o Caixa (Turnos)',
                                                count: `${sessions.length} turno(s) registrado(s)`,
                                                icon: 'ph-wallet',
                                                desc: 'Apaga todos os registros de abertura e fechamento de caixa e operadores.'
                                            },
                                            {
                                                key: 'products',
                                                title: 'Catálogo de Produtos',
                                                count: `${products.length} produto(s) cadastrado(s)`,
                                                icon: 'ph-package',
                                                desc: 'Exclui todos os produtos cadastrados, deixando o sistema sem produtos.'
                                            },
                                            {
                                                key: 'sales',
                                                title: 'Histórico de Vendas',
                                                count: `${sales.length} venda(s) realizada(s)`,
                                                icon: 'ph-shopping-cart',
                                                desc: 'Zera todas as vendas e o faturamento do Dashboard e do Financeiro.'
                                            },
                                            {
                                                key: 'cashMovements',
                                                title: 'Sangrias e Reforços',
                                                count: `${cashMovements.length} movimentação(ões)`,
                                                icon: 'ph-arrows-left-right',
                                                desc: 'Limpa todos os registros de retiradas (sangrias) e reforços de caixa.'
                                            },
                                            {
                                                key: 'expenses',
                                                title: 'Despesas Financeiras',
                                                count: `${expenses.length} despesa(s) lançada(s)`,
                                                icon: 'ph-trend-down',
                                                desc: 'Apaga todas as saídas e despesas registradas na aba Financeiro.'
                                            },
                                            {
                                                key: 'history',
                                                title: 'Histórico de Atividades',
                                                count: `${history.length} ação(ões) no log`,
                                                icon: 'ph-clock-counter-clockwise',
                                                desc: 'Zera todo o registro de atividades de colaboradores e administradores.'
                                            }
                                        ].map(card => (
                                            <div key={card.key} className="bg-[#050B14] border border-panel-border rounded-xl p-4 flex flex-col justify-between gap-4">
                                                <div>
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className="text-xs font-bold text-gold-accent bg-gold-accent/10 px-2.5 py-1 rounded">{card.count}</span>
                                                        <i className={`ph ${card.icon} text-xl text-text-muted`}></i>
                                                    </div>
                                                    <h4 className="text-sm font-bold text-white">{card.title}</h4>
                                                    <p className="text-xs text-text-muted mt-1 leading-relaxed">{card.desc}</p>
                                                </div>
                                                <button 
                                                    onClick={() => setWipeTarget(card)}
                                                    className="w-full py-2.5 px-3 rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/30 text-xs font-bold flex items-center justify-center gap-2 transition-colors"
                                                >
                                                    <i className="ph ph-trash"></i> Limpar {card.title}
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SUB-ABA: COLABORADORES OU ADMINISTRADORES */}
                        {(subTab === 'colab' || subTab === 'admin') && (
                            <div className="p-6 overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-[#050B14]">
                                        <tr>
                                            <th className="px-6 py-4">Nome / E-mail</th>
                                            <th className="px-6 py-4">Cargo</th>
                                            <th className="px-6 py-4">Abas Liberadas</th>
                                            <th className="px-6 py-4 text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {(subTab === 'colab' ? colabList : adminList).length === 0 ? (
                                            <tr><td colSpan="4" className="text-center py-10 text-text-muted">Nenhum {subTab === 'colab' ? 'colaborador' : 'administrador'} cadastrado nesta lista.</td></tr>
                                        ) : (
                                            (subTab === 'colab' ? colabList : adminList).map(u => (
                                                <tr key={u.id} className="border-b border-[#1A233A]/50 hover:bg-white/5">
                                                    <td className="px-6 py-4">
                                                        <div className="font-semibold text-white">{u.name}</div>
                                                        <div className="text-xs text-text-muted">{u.email}</div>
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        {u.role === 'admin' ? (
                                                            <span className="px-2.5 py-1 rounded text-xs font-semibold bg-gold-accent/15 text-gold-accent">Administrador</span>
                                                        ) : (
                                                            <span className="px-2.5 py-1 rounded text-xs font-semibold bg-primary-blue/15 text-blue-400">Colaborador</span>
                                                        )}
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        {u.role === 'admin' ? (
                                                            <span className="text-xs text-green-400">Acesso Total da Empresa</span>
                                                        ) : (
                                                            <div className="flex flex-wrap gap-1 max-w-md">
                                                                {(u.permissions || []).map(p => (
                                                                    <span key={p} className="text-[10px] bg-[#050B14] border border-panel-border px-2 py-0.5 rounded text-text-light">
                                                                        {ALL_NAV_TABS.find(t => t.id === p)?.label || p}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="px-6 py-4 text-right">
                                                        <div className="flex justify-end gap-2">
                                                            <button onClick={() => openEditUserModal(u)} className="p-2 rounded-lg bg-[#050B14] border border-panel-border text-text-light hover:text-white" title="Editar Nome e Permissões">
                                                                <i className="ph ph-pencil-simple"></i>
                                                            </button>
                                                            <button onClick={() => setDeleteUserModal(u)} className="p-2 rounded-lg bg-[#050B14] border border-panel-border text-red-400 hover:bg-red-500/10" title="Excluir Acesso">
                                                                <i className="ph ph-trash"></i>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}

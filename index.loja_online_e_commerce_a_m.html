            const manifest = {
                name: "Loja Online A&M",
                short_name: "Loja A&M",
                description: "Catálogo Online Integrado ao Estoque e Mercado Pago",
                start_url: window.location.href,
                display: "standalone",
                background_color: "#050B14",

                    { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
                ]
            };
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'data:application/manifest+json;utf8,' + encodeURIComponent(JSON.stringify(manifest));
            document.head.appendChild(link);
        })();

    <!-- Blindagem Anti-Inspeção e Anti-DevTools -->
    <script>
        (function() {
            'use strict';
            window.addEventListener('DOMContentLoaded', () => {
                window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); return false; }, true);
                window.addEventListener('keydown', e => {
                    const key = (e.key || '').toUpperCase();
                    if (key === 'F12' || e.keyCode === 123 ||
                        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K', 'U'].includes(key)) ||
                        (e.ctrlKey && ['U', 'S', 'P'].includes(key)) ||
                        (e.metaKey && e.altKey && ['I', 'J', 'C', 'U'].includes(key))) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                }, true);
            });
        })();

        // Contexto de Toasts
        const ToastContext = createContext(null);
        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const addToast = useCallback((message, type = 'info') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
            }, []);
            const toast = useMemo(() => ({
                success: (m) => addToast(m, 'success'),
                error: (m) => addToast(m, 'error'),
                info: (m) => addToast(m, 'info')
            }), [addToast]);

            return (
                <ToastContext.Provider value={toast}>
                    {children}
                    <div className="toast-container">
                        {toasts.map(t => (
                            <div key={t.id} className={`toast ${t.type}`}>

            const [settings, setSettings] = useState({});

            const [processingOrder, setProcessingOrder] = useState(false);
            const [mpPreferenceUrl, setMpPreferenceUrl] = useState('');
            const [lastCreatedOrder, setLastCreatedOrder] = useState(null);

            // Sincronização em tempo real com o Firebase do Caixa Principal

                    unsubProducts();
                    unsubOrders();

            // Inicializa o SDK do Mercado Pago sempre que a Public Key estiver configurada no Caixa

                if (settings?.mpPublicKey && window.MercadoPago) {
                    try {
                        window.mpInstance = new window.MercadoPago(settings.mpPublicKey.trim(), { locale: 'pt-BR' });

                        console.warn("Aviso ao iniciar SDK Mercado Pago:", e);
                    }
                }
            }, [settings?.mpPublicKey]);

            // Verifica se o Administrador/Programador liberou o E-commerce para operar
            const isEcommerceLiberated = settings?.ecommerceEnabled === true && !(settings?.blockedTabs || []).includes('ecommerce');

            // Produtos ativos do Caixa e Categorias separadas automaticamente
            const activeProducts = useMemo(() => {
                return products.filter(p => p.active !== false && !p.blocked);
            }, [products]);

            const categories = useMemo(() => ['TODAS', ...storeNames([...(settings.storeCategories ?? DEFAULT_STORE_CATEGORIES), ...activeProducts.map(p=>p.category || 'Geral')])], [activeProducts,settings.storeCategories]);
            const brands = useMemo(() => storeNames([...(settings.storeBrands || []), ...activeProducts.map(p=>p.brand)]), [activeProducts,settings.storeBrands]);
            const priceCeiling = Math.max(1,...activeProducts.map(p=>Number(p.price)||0));
            const filteredProducts = useMemo(() => activeProducts.filter(p => {
                const text=[p.name,p.category,p.brand,p.barcode].filter(Boolean).join(' ').toLocaleLowerCase('pt-BR');
                return (selectedCategory==='TODAS' || (p.category || 'Geral')===selectedCategory) && text.includes(searchQuery.toLocaleLowerCase('pt-BR')) && (!selectedBrands.length || selectedBrands.includes(p.brand)) && (maxPrice==='' || Number(p.price)<=Number(maxPrice));
            }), [activeProducts, selectedCategory,searchQuery,selectedBrands,maxPrice]);
            const pageSize=24;
            const pageCount=Math.max(1,Math.ceil(filteredProducts.length/pageSize));
            const currentPage=Math.min(page,pageCount);
            const visibleProducts=filteredProducts.slice((currentPage-1)*pageSize,currentPage*pageSize);
            const visibleSections=selectedCategory==='TODAS' ? categories.slice(1) : [selectedCategory];
            const resetFilters=()=>{setSelectedCategory('TODAS');setSelectedBrands([]);setMaxPrice('');setSearchQuery('');};

            const addToCart = (prod) => {
                if (Number(prod.stock) <= 0) {
                    toast.error("Este produto está esgotado no momento.");
                    return;
                }
                setCart(prev => {
                    const existing = prev.find(i => i.id === prod.id);
                    if (existing && existing.qty >= Number(prod.stock)) {
                        toast.error("Quantidade máxima disponível em estoque atingida.");
                        return prev;
                    }
                    toast.success(`${prod.name} adicionado à sacola!`);
                    if (existing) return prev.map(i => i.id === prod.id ? { ...i, qty: i.qty + 1 } : i);
                    return [...prev, { id: prod.id, name: prod.name, price: Number(prod.price), cost: Number(prod.cost || 0), imageUrl: prod.imageUrl || '', stock: Number(prod.stock), qty: 1 }];
                });
            };

            const updateCartQty = (id, delta) => {
                setCart(prev => prev.flatMap(item => {
                    if (item.id !== id) return [item];
                    const latestProd = activeProducts.find(p => p.id === id);
                    const maxStock = latestProd ? Number(latestProd.stock) : item.stock;
                    const nextQty = item.qty + delta;
                    if (nextQty <= 0) return [];
                    if (nextQty > maxStock) {
                        toast.error(`Apenas ${maxStock} un. disponíveis em estoque.`);
                        return [item];
                    }
                    return [{ ...item, qty: nextQty }];
                }));
            };

            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const shippingCost = deliveryType === 'pickup' ? 0 : parseFloat(settings?.shippingFee || 0);
            const totalOrder = subtotal + shippingCost;

            // Busca automática de CEP via ViaCEP
            const lookupCEP = async (rawCep) => {
                const clean = String(rawCep || '').replace(/\D/g, '');
                if (clean.length !== 8) return;
                try {
                    const res = await fetch(`https://viacep.com.br/ws/${clean}/json/`);
                    const d = await res.json();
                    if (!d.erro) {
                        setCustomer(prev => ({
                            ...prev,
                            cep: clean,
                            street: d.logradouro || prev.street,
                            neighborhood: d.bairro || prev.neighborhood,
                            city: d.localidade || prev.city,
                            state: d.uf || prev.state
                        }));
                    }
                } catch {}
            };

            const handleProceedToMercadoPago = async (e) => {
                e.preventDefault();
                if (!settings?.mpPublicKey || !settings?.mpAccessToken) {
                    toast.error("O administrador ainda não configurou as 2 chaves do Mercado Pago no Caixa.");
                    return;
                }
                if (cart.length === 0) return;

                // Valida se todos os itens ainda possuem estoque no caixa
                for (const item of cart) {
                    const liveProd = activeProducts.find(p => p.id === item.id);
                    if (!liveProd || Number(liveProd.stock) < item.qty) {
                        toast.error(`O estoque de "${item.name}" mudou. Ajuste sua sacola.`);
                        return;
                    }
                }

                setProcessingOrder(true);
                setMpPreferenceUrl('');

                // Tenta criar uma Preferência real na API do Mercado Pago usando o Access Token configurado no Caixa

                    const prefBody = {
                        items: [
                            ...cart.map(i => ({
                                id: String(i.id),
                                title: i.name,
                                quantity: Number(i.qty),
                                currency_id: 'BRL',
                                unit_price: Number(i.price)
                            })),
                            ...(shippingCost > 0 ? [{
                                id: 'shipping',
                                title: 'Frete / Entrega',
                                quantity: 1,
                                currency_id: 'BRL',
                                unit_price: Number(shippingCost)
                            }] : [])
                        ],
                        payer: {
                            name: customer.name,
                            email: customer.email || 'cliente@loja.com.br'
                        },
                        external_reference: `ECOM-${Date.now()}`
                    };

                    const mpResponse = await fetch('https://api.mercadopago.com/checkout/preferences', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${settings.mpAccessToken.trim()}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(prefBody)
                    });

                    if (mpResponse.ok) {
                        const mpData = await mpResponse.json();
                        if (mpData.init_point) {
                            setMpPreferenceUrl(mpData.init_point);
                        }
                    }
                } catch (err) {
                    console.warn("Checkout transparente local ativado:", err);
                }

                setProcessingOrder(false);
                setCheckoutStep('mp_payment');
            };

            // Confirma o Pagamento via Mercado Pago, dá baixa no estoque do Caixa e registra como Venda Online!
            const handleConfirmOnlineSale = async () => {
                if (cart.length === 0 || processingOrder) return;
                setProcessingOrder(true);

                try {
                    // Verifica novamente o estoque em tempo real antes de gravar
                    for (const item of cart) {
                        const liveProd = activeProducts.find(p => p.id === item.id);
                        if (!liveProd || Number(liveProd.stock) < item.qty) {
                            toast.error(`Desculpe, "${item.name}" acabou de esgotar.`);
                            setProcessingOrder(false);
                            return;
                        }
                    }

                    const nowIso = new Date().toISOString();
                    const fullAddress = deliveryType === 'pickup'
                        ? 'Retirada na Loja'
                        : `${customer.street}, ${customer.number} ${customer.complement ? '- ' + customer.complement : ''} - ${customer.neighborhood}, ${customer.city}/${customer.state} (CEP: ${customer.cep})`;

                    // 1. Registra o Pedido na coleção `orders`
                    const orderDoc = await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'orders'), {
                        createdAt: nowIso,
                        date: nowIso,
                        status: 'paid',
                        fulfillmentStatus: 'preparing',
                        paymentGateway: 'Mercado Pago',
                        paymentMethod: mpPaymentMethod,
                        mpPublicKeyUsed: (settings.mpPublicKey || '').slice(0, 14) + '***',
                        deliveryType,
                        customer: {
                            name: customer.name,
                            phone: customer.phone,
                            email: customer.email,
                            address: fullAddress
                        },
                        items: cart,
                        subtotal,
                        shipping: shippingCost,
                        total: totalOrder
                    });

                    // 2. Registra na coleção `sales` do Caixa Principal como Venda Online
                    await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'sales'), {
                        sessionId: 'ecommerce_online',
                        source: 'ecommerce',
                        orderId: orderDoc.id,
                        operator: 'ecommerce@mercadopago',
                        operatorName: `Venda Online (${customer.name.split(' ')[0]})`,
                        items: cart,
                        subtotal,
                        discount: 0,
                        cardSurcharge: 0,
                        shipping: shippingCost,
                        total: totalOrder,
                        payment: `Mercado Pago (${mpPaymentMethod})`,
                        received: totalOrder,
                        date: nowIso
                    });

                    // 3. Dá baixa automática no estoque de cada produto na coleção `products`
                    for (const item of cart) {
                        const liveProd = activeProducts.find(p => p.id === item.id);
                        if (liveProd) {
                            const nextStock = Math.max(0, Number(liveProd.stock) - Number(item.qty));
                            await window.fb.updateDoc(window.fb.doc(window.firebaseDb, 'products', item.id), {
                                stock: nextStock
                            });
                        }
                    }

                    // 4. Registra no Histórico do Caixa Principal
                    await window.fb.addDoc(window.fb.collection(window.firebaseDb, 'history'), {
                        at: nowIso,
                        userName: `Loja E-commerce (${customer.name})`,
                        userEmail: customer.email || 'cliente@ecommerce',
                        userRole: 'ecommerce',
                        action: 'Venda Online (Mercado Pago)',
                        details: `Pedido #${orderDoc.id.slice(0,6).toUpperCase()} - Total: ${formatMoney(totalOrder)} via Mercado Pago (${mpPaymentMethod})`
                    });

                    const updatedMyOrders = [orderDoc.id, ...myOrderIds];
                    setMyOrderIds(updatedMyOrders);
                    try { localStorage.setItem('am_ecommerce_my_orders', JSON.stringify(updatedMyOrders)); } catch {}

                    setLastCreatedOrder({ id: orderDoc.id, total: totalOrder, paymentMethod: mpPaymentMethod });
                    setCart([]);
                    setCheckoutStep('success');
                    toast.success("Pagamento confirmado! Sua compra foi enviada para a loja.");
                } catch (err) {
                    toast.error("Erro ao processar pedido online: " + err.message);
                }
                setProcessingOrder(false);
            };

            if(loadError)return <div className="min-h-screen bg-[#050B14] text-white flex items-center justify-center p-8"><div><h1 className="font-bold text-xl">Conexão indisponível</h1><p className="my-4">{loadError}</p><button className="am-gold p-3 rounded-lg" onClick={()=>location.reload()}>Tentar novamente</button></div></div>;
            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-[#050B14] text-white">
                        <div className="w-12 h-12 rounded-full border-t-2 border-gold-accent animate-spin mb-4"></div>

                );

            if (!isEcommerceLiberated) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#050B14] p-4 text-center">
                        <div className="glass-panel p-8 sm:p-10 max-w-md w-full border border-gold-accent/30">
                            <div className="w-20 h-20 rounded-2xl bg-gold-accent/10 border border-gold-accent/30 text-gold-accent flex items-center justify-center mx-auto mb-5">
                                <i className="ph-fill ph-storefront text-4xl"></i>

                            <p className="text-sm text-text-muted mt-3 leading-relaxed">

                            </p>
                            {settings?.storeWhatsapp && (
                                <p className="text-xs text-gold-accent font-semibold mt-4">
                                    Atendimento: {settings.storeWhatsapp}
                                </p>
                            )}
                        </div>
                    </div>
                );

            const customerOrdersList = orders.filter(o => myOrderIds.includes(o.id)).sort((a, b) => new Date(b.createdAt || b.date) - new Date(a.createdAt || a.date));

            return (
                <div className="am-store min-h-screen flex flex-col text-text-light">

                            <div><h1>{settings.storeTitle || settings.name || 'Loja Online A&M'}</h1><small>🛡 Pagamento via Mercado Pago</small></div>

                        <div className="am-search"><i className="ph ph-magnifying-glass"/><input aria-label="Buscar produtos, categorias ou marcas" placeholder="Buscar produtos, categorias ou marcas..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)}/><i className="ph ph-magnifying-glass am-search-glow"/></div>

                    </header>
                    <main className="am-main">
                        <section className="am-hero" style={{backgroundImage:`${settings.storeBannerOverlay !== false ? 'linear-gradient(90deg,rgba(5,11,20,.85),rgba(5,11,20,.05)),':''}url("${settings.storeBannerImage || STORE_WAVE}")`,backgroundPosition:settings.storeBannerPosition || 'center'}} aria-label="Banner da loja">
                            {settings.storeBannerOverlay !== false && <div><span className="am-pill">ϟ ESTOQUE SINCRONIZADO EM TEMPO REAL</span><h2>{settings.storeTitle || settings.name || 'Loja Online A&M'}</h2><p>{settings.storeBannerText || 'Compre online com segurança e receba rapidamente.'}</p></div>}
                        </section>
                        <nav className="am-categories" aria-label="Categorias da loja">{categories.map(cat=><button key={cat} className={selectedCategory===cat?'active':''} onClick={()=>setSelectedCategory(cat)}><i className={'ph '+(cat==='TODAS'?'ph-folder':'ph-package')}/> {cat==='TODAS'?'Todas as Categorias':cat}</button>)}</nav>
                        <div className="am-catalog-layout">
                            <aside className="am-filters">
                                <details open><summary>FILTRAR POR</summary><div className="am-category-list">{categories.slice(1).map(cat=><button key={cat} className={selectedCategory===cat?'selected':''} onClick={()=>setSelectedCategory(selectedCategory===cat?'TODAS':cat)}><i className="ph ph-squares-four"/>{cat}<span>›</span></button>)}</div></details>
                                <div className="am-filter-block"><label htmlFor="price-filter">Preço máximo</label><input id="price-filter" type="range" min="0" max={priceCeiling} step="0.01" value={maxPrice===''?priceCeiling:Math.min(Number(maxPrice),priceCeiling)} onChange={e=>setMaxPrice(e.target.value)}/><small>Até {formatMoney(maxPrice===''?priceCeiling:maxPrice)}</small></div>
                                <details open className="am-filter-block"><summary>Marcas</summary><div className="am-brands">{brands.map(brand=><label key={brand}><input type="checkbox" checked={selectedBrands.includes(brand)} onChange={e=>setSelectedBrands(v=>e.target.checked?[...v,brand]:v.filter(b=>b!==brand))}/>{brand}</label>)}{!brands.length && <small>Nenhuma marca cadastrada.</small>}</div></details>
                                <button className="am-clear" onClick={resetFilters}>Limpar filtros</button>
                            </aside>
                            <div className="am-catalog">
                                <div className="am-catalog-heading"><span>ϟ EXPLORE NOSSA VITRINE</span><small>{filteredProducts.length} produto(s)</small></div>
                                {visibleSections.map(cat=>{
                                    const items=visibleProducts.filter(p=>(p.category || 'Geral')===cat);
                                    const count=filteredProducts.filter(p=>(p.category || 'Geral')===cat).length;
                                    if(!items.length && count>0)return null;
                                    return <section className="am-product-section" key={cat}><div className="am-section-title"><h3><i className="ph ph-lightning"/> {cat}</h3><small>{count} produto(s)</small></div>
                                        {items.length ? <div className="am-product-grid">{items.map(prod=>{
                                            const outOfStock=Number(prod.stock)<=0;const qty=cart.find(i=>i.id===prod.id)?.qty || 0;
                                            return <article className="am-product" key={prod.id}>

                                                <div className="am-product-copy"><small>{prod.brand || cat}</small><h4 title={prod.name}>{prod.name}</h4><strong>{formatMoney(prod.price)}</strong><div className="am-buy-row"><button className="am-gold" disabled={outOfStock || qty>=Number(prod.stock)} onClick={()=>{addToCart(prod);setCheckoutStep('cart');setCartOpen(true);}}>{outOfStock?'Esgotado':'Comprar'}</button><button aria-label={'Adicionar '+prod.name+' à sacola'} title={qty?`${qty} na sacola`:'Adicionar à sacola'} disabled={outOfStock || qty>=Number(prod.stock)} onClick={()=>addToCart(prod)}><i className="ph ph-shopping-cart"/>{qty>0 && <sup>{qty}</sup>}</button></div></div>
                                            </article>;
                                        })}</div>:<div className="am-empty"><i className="ph ph-package"/><div><strong>{activeProducts.some(p=>(p.category || 'Geral')===cat)?'Nenhum produto com estes filtros':'Novidades em breve'}</strong><p>{activeProducts.some(p=>(p.category || 'Geral')===cat)?'Altere os filtros para explorar esta categoria.':'Esta categoria já faz parte da nossa loja. Acompanhe as próximas novidades.'}</p></div></div>}

                            </div>

                        <div className="am-payment-strip"><span><i className="ph ph-shield-check"/> Pagamento via</span><strong className="am-mp">mercado pago</strong><strong className="am-pix">❖ PIX</strong><strong className="am-visa">VISA</strong><span className="am-mastercard"><b>●</b><b>●</b></span><strong>Cartões</strong></div>
                    </main>
                    <footer className="am-footer"><strong>{settings.storeTitle || settings.name || 'Loja Online A&M'}</strong>{settings.address && <p>{settings.address}</p>}{settings.storeWhatsapp && <p>Atendimento: {settings.storeWhatsapp}</p>}<small>Disponibilidade e estoque atualizados pelo caixa.</small></footer>
                    {accountOpen && <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4"><form className="glass-panel w-full max-w-md p-6 space-y-4" onSubmit={e=>{e.preventDefault();setAccountOpen(false);toast.success('Dados salvos neste dispositivo.');}}><div className="flex justify-between"><h2 className="font-bold">Meus dados</h2><button type="button" onClick={()=>setAccountOpen(false)} aria-label="Fechar">×</button></div><p className="text-xs text-text-muted">Salvos somente neste navegador para facilitar suas compras.</p>{[['name','Nome'],['email','E-mail'],['phone','Telefone']].map(([key,label])=><label className="block text-sm" key={key}>{label}<input className="input-dark rounded-lg p-3 w-full mt-1" type={key==='email'?'email':'text'} value={customer[key] || ''} onChange={e=>setCustomer(p=>({...p,[key]:e.target.value}))}/></label>)}<button type="submit" className="am-gold w-full p-3 rounded-lg">Salvar dados</button></form></div>}

                    {/* MODAL DE CHECKOUT E PAGAMENTO MERCADO PAGO */}
                    {cartOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-sm fade-in">
                            <div className="glass-panel w-full max-w-xl max-h-[92vh] flex flex-col overflow-hidden border border-[#2A3B5C]">
                                <div className="p-5 border-b border-panel-border flex justify-between items-center bg-[#050B14]">
                                    <div className="flex items-center gap-2.5">
                                        <i className="ph-fill ph-shopping-bag text-2xl text-gold-accent"></i>
                                        <div>
                                            <h3 className="text-base font-bold text-white">
                                                {checkoutStep === 'cart' ? 'Sua Sacola de Compras' : checkoutStep === 'customer' ? 'Dados de Entrega' : checkoutStep === 'mp_payment' ? 'Pagamento Seguro Mercado Pago' : 'Pedido Confirmado!'}

                                            <p className="text-xs text-text-muted">Sincronizado em tempo real com o Caixa A&M</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setCartOpen(false)} className="text-text-muted hover:text-white p-1.5">
                                        <i className="ph ph-x text-xl"></i>

                                </div>

                                <div className="p-5 sm:p-6 overflow-y-auto space-y-5">
                                    {/* ETAPA 1: REVISÃO DA SACOLA */}
                                    {checkoutStep === 'cart' && (
                                        <>
                                            {cart.length === 0 ? (

                                                    <i className="ph ph-shopping-cart text-5xl mb-3 opacity-40"></i>
                                                    <p className="text-sm">Sua sacola está vazia.</p>
                                                </div>
                                            ) : (
                                                <>
                                                    <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                                                        {cart.map(item => (
                                                            <div key={item.id} className="flex items-center justify-between gap-3 bg-[#050B14] border border-panel-border p-3 rounded-xl">
                                                                <div className="min-w-0 flex-1">
                                                                    <p className="text-sm font-bold text-white truncate">{item.name}</p>
                                                                    <p className="text-xs text-gold-accent font-semibold">{formatMoney(item.price)} un.</p>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <button type="button" onClick={() => updateCartQty(item.id, -1)} className="w-7 h-7 rounded-lg bg-[#0A1222] border border-panel-border text-white">-</button>
                                                                    <span className="w-6 text-center text-xs font-bold text-white">{item.qty}</span>
                                                                    <button type="button" onClick={() => updateCartQty(item.id, 1)} className="w-7 h-7 rounded-lg bg-[#0A1222] border border-panel-border text-white">+</button>
                                                                </div>
                                                                <strong className="text-sm font-bold text-white w-20 text-right">{formatMoney(item.price * item.qty)}</strong>
                                                            </div>
                                                        ))}
                                                    </div>

                                                    <div className="bg-[#050B14] border border-panel-border rounded-xl p-4 space-y-2 text-xs">
                                                        <div className="flex justify-between">
                                                            <span className="text-text-muted">Subtotal dos Produtos</span>
                                                            <span className="text-white font-bold">{formatMoney(subtotal)}</span>

                                            {mpPreferenceUrl && (
                                                <a
                                                    href={mpPreferenceUrl}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="w-full py-3 rounded-xl bg-[#050B14] border border-mp-blue text-mp-blue hover:bg-mp-blue/10 text-xs font-bold flex items-center justify-center gap-2"
                                                >
                                                    <i className="ph-bold ph-arrow-square-out"></i> Abrir Ambiente Externo do Mercado Pago (Opcional)
                                                </a>
                                            )}

                                            <div className="flex justify-between gap-3 pt-2">
                                                <button type="button" onClick={() => setCheckoutStep('customer')} className="px-4 py-3 rounded-xl border border-panel-border text-xs font-bold text-text-light">Voltar</button>
                                                <button
                                                    type="button"
                                                    disabled={processingOrder}
                                                    onClick={handleConfirmOnlineSale}
                                                    className="flex-1 py-4 rounded-xl bg-green-600 hover:bg-green-500 text-white font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg"
                                                >
                                                    <i className="ph-bold ph-check-circle text-lg"></i>
                                                    {processingOrder ? 'Registrando Venda Online no Caixa...' : `Confirmar Pagamento (${formatMoney(totalOrder)})`}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* ETAPA 4: CONFIRMAÇÃO DE COMPRA */}
                                    {checkoutStep === 'success' && lastCreatedOrder && (
                                        <div className="py-6 text-center space-y-4">
                                            <div className="w-16 h-16 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center mx-auto">
                                                <i className="ph-fill ph-check-circle text-4xl"></i>
                                            </div>
                                            <h4 className="text-xl font-extrabold text-white">Compra Online Confirmada!</h4>
                                            <p className="text-xs text-text-muted max-w-md mx-auto">
                                                Seu pedido <strong className="text-gold-accent">#{String(lastCreatedOrder.id).slice(0, 6).toUpperCase()}</strong> no valor de <strong className="text-white">{formatMoney(lastCreatedOrder.total)}</strong> foi registrado diretamente no Caixa da loja via Mercado Pago.
                                            </p>
                                            <button
                                                type="button"
                                                onClick={() => { setCartOpen(false); setMyOrdersOpen(true); }}
                                                className="px-6 py-3 rounded-xl bg-primary-blue text-white text-xs font-bold"
                                            >
                                                Acompanhar Meu Pedido
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL DE ACOMPANHAMENTO DE PEDIDOS DO CLIENTE */}
                    {myOrdersOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/80 backdrop-blur-sm fade-in">
                            <div className="glass-panel w-full max-w-lg max-h-[88vh] flex flex-col overflow-hidden border border-[#2A3B5C]">
                                <div className="p-5 border-b border-panel-border flex justify-between items-center bg-[#050B14]">
                                    <h3 className="text-base font-bold text-white">Meus Pedidos Online</h3>
                                    <button onClick={() => setMyOrdersOpen(false)} className="text-text-muted hover:text-white p-1.5">
                                        <i className="ph ph-x text-xl"></i>
                                    </button>
                                </div>
                                <div className="p-5 overflow-y-auto space-y-3">
                                    {customerOrdersList.length === 0 ? (
                                        <p className="text-xs text-text-muted text-center py-8">Você ainda não realizou pedidos neste dispositivo.</p>
                                    ) : (
                                        customerOrdersList.map(ord => (
                                            <div key={ord.id} className="p-4 rounded-xl bg-[#050B14] border border-panel-border space-y-1.5 text-xs">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-mono font-bold text-gold-accent">PEDIDO #{String(ord.id).slice(0, 6).toUpperCase()}</span>
                                                    <span className="px-2.5 py-0.5 rounded-full bg-primary-blue/20 text-blue-400 font-bold">
                                                        {ord.fulfillmentStatus === 'delivered' ? 'Entregue / Concluído' : ord.fulfillmentStatus === 'dispatched' ? 'Saiu para Entrega' : 'Em Preparação'}
                                                    </span>
                                                </div>
                                                <p className="text-white font-medium">{(ord.items || []).map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
                                                <div className="flex justify-between items-center text-text-muted pt-1">
                                                    <span>{new Date(ord.createdAt || ord.date).toLocaleString()}</span>
                                                    <strong className="text-sm text-white">{formatMoney(ord.total)}</strong>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Root = () => (
            <ToastProvider>
                <EcommerceStore />
            </ToastProvider>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>
</html>
